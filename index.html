<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klassrumsskärm</title>
  
  <!-- Tailwind CSS för snygg design -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & Babel för att köra koden i webbläsaren utan installationer -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="module">
    // Importerar nödvändiga Firebase-funktioner
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // DIN SPECIFIKA FIREBASE-KONFIGURATION
    const firebaseConfig = {
      apiKey: "AIzaSyCjnV83LrQ-I-5WMf-6EJ9xqV5xnufO6LQ",
      authDomain: "whiteboard-klassrum.firebaseapp.com",
      projectId: "whiteboard-klassrum",
      storageBucket: "whiteboard-klassrum.firebasestorage.app",
      messagingSenderId: "298760316508",
      appId: "1:298760316508:web:55608b567db408f14ae899"
    };

    // Starta Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    // Gör funktionerna tillgängliga för React-koden
    window.fbDb = db;
    window.fbAuth = auth;
    window.fbGoogleProvider = googleProvider;
    window.fbSignInWithPopup = signInWithPopup;
    window.fbSignOut = signOut;
    window.fbCollection = collection;
    window.fbAddDoc = addDoc;
    window.fbGetDocs = getDocs;
    window.fbDeleteDoc = deleteDoc;
    window.fbDoc = doc;

    onAuthStateChanged(auth, (user) => {
      window.fbUser = user;
      window.dispatchEvent(new CustomEvent('firebase-auth-changed', { detail: user }));
    });
  </script>

  <style>
    body { user-select: none; overflow: hidden; margin: 0; background-color: #0f172a; font-family: 'Inter', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.25); border-radius: 4px; }
    .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 10px 40px -10px rgba(0,0,0,0.3); }
    input, textarea, select { cursor: text; user-select: text; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Språkordlista (Svenska & Engelska)
    const i18n = {
      sv: {
        appTitle: "Klassrumsskärm", agenda: "Agenda", timer: "Timer", traffic: "Trafikljus", work: "Arbetsform", dice: "Tärning", random: "Slumpa Elev", notes: "Anteckningar", qrcode: "QR-kod", changeBg: "Bakgrund", templates: "Molnmallar", clear: "Rensa", sure: "Säker?", add: "Lägg till", placeholder: "Ny lektionspunkt...", start: "Starta", pause: "Pausa", reset: "Nollställ", saveTemplate: "Spara till molnet", loadTemplate: "Öppna", templateName: "Namn på lektion...", chooseRandom: "Slumpa!", rollDice: "Kasta tärning", silence: "Tystnad", whisper: "Viska", ask: "Fråga kompis", group: "Samarbete", emptyAgenda: "Inga punkter än. Lägg till en nedan!"
      },
      en: {
        appTitle: "Classroom Screen", agenda: "Agenda", timer: "Timer", traffic: "Traffic Light", work: "Work Mode", dice: "Dice", random: "Random Picker", notes: "Notes", qrcode: "QR Code", changeBg: "Background", templates: "Cloud Templates", clear: "Clear", sure: "Sure?", add: "Add", placeholder: "New item...", start: "Start", pause: "Pause", reset: "Reset", saveTemplate: "Save to Cloud", loadTemplate: "Load", templateName: "Lesson name...", chooseRandom: "Pick!", rollDice: "Roll Dice", silence: "Silence", whisper: "Whisper", ask: "Ask Neighbor", group: "Group Work", emptyAgenda: "No items yet. Add one below!"
      }
    };

    const BACKGROUNDS = [
      { name: 'Höst / Autumn', url: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=80' },
      { name: 'Skog / Forest', url: 'https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=2000&q=80' },
      { name: 'Sjö / Lake', url: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=2000&q=80' },
      { name: 'Rymden / Space', url: 'https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?auto=format&fit=crop&w=2000&q=80' },
      { name: 'Svart Tavla / Blackboard', url: 'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=2000&q=80' }
    ];

    function App() {
      const [lang, setLang] = useState('sv');
      const [bg, setBg] = useState(BACKGROUNDS[0].url);
      const [widgets, setWidgets] = useState([]);
      const [showBgModal, setShowBgModal] = useState(false);
      const [showCloudModal, setShowCloudModal] = useState(false);
      const [resetConfirm, setResetConfirm] = useState(false);
      const [topZ, setTopZ] = useState(10);
      const [currentUser, setCurrentUser] = useState(null);

      const t = i18n[lang];

      useEffect(() => {
        const handleAuth = (e) => setCurrentUser(e.detail);
        window.addEventListener('firebase-auth-changed', handleAuth);
        if (window.fbAuth?.currentUser) setCurrentUser(window.fbAuth.currentUser);
        return () => window.removeEventListener('firebase-auth-changed', handleAuth);
      }, []);

      // Drag & Drop logik
      const [draggingId, setDraggingId] = useState(null);
      const dragOffset = useRef({ x: 0, y: 0 });

      const onPointerDown = (id, e) => {
        if (['INPUT', 'BUTTON', 'TEXTAREA', 'SELECT', 'SVG'].some(tag => e.target.closest(tag))) return;
        const clientX = e.clientX ?? e.touches?.[0]?.clientX;
        const clientY = e.clientY ?? e.touches?.[0]?.clientY;
        const widget = widgets.find(w => w.id === id);
        if (!widget || clientX === undefined) return;
        
        setTopZ(prev => prev + 1);
        setWidgets(prev => prev.map(w => w.id === id ? { ...w, z: topZ + 1 } : w));
        dragOffset.current = { x: clientX - widget.x, y: clientY - widget.y };
        setDraggingId(id);
      };

      useEffect(() => {
        const handleMove = (e) => {
          if (!draggingId) return;
          const clientX = e.clientX ?? e.touches?.[0]?.clientX;
          const clientY = e.clientY ?? e.touches?.[0]?.clientY;
          if (clientX === undefined) return;
          const newX = Math.max(0, clientX - dragOffset.current.x);
          const newY = Math.max(64, clientY - dragOffset.current.y);
          setWidgets(prev => prev.map(w => w.id === draggingId ? { ...w, x: newX, y: newY } : w));
        };
        const handleUp = () => setDraggingId(null);

        if (draggingId) {
          window.addEventListener('mousemove', handleMove);
          window.addEventListener('mouseup', handleUp);
          window.addEventListener('touchmove', handleMove, { passive: false });
          window.addEventListener('touchend', handleUp);
        }
        return () => {
          window.removeEventListener('mousemove', handleMove);
          window.removeEventListener('mouseup', handleUp);
          window.removeEventListener('touchmove', handleMove);
          window.removeEventListener('touchend', handleUp);
        };
      }, [draggingId]);

      const updateWidgetData = (id, newProps) => {
        setWidgets(prev => prev.map(w => w.id === id ? { ...w, data: { ...w.data, ...newProps } } : w));
      };

      const removeWidget = (id) => setWidgets(prev => prev.filter(w => w.id !== id));

      const addWidget = (type) => {
        setTopZ(prev => prev + 1);
        let defaultWidth = 350;
        let initialData = {};

        switch(type) {
          case 'agenda': 
            initialData = { 
              items: [
                { id: 1, text: "Närvarokontroll", icon: "📋", done: false },
                { id: 2, text: "Tyst läsning", icon: "📖", done: false },
                { id: 3, text: "Grupparbete", icon: "👥", done: false }
              ] 
            }; 
            defaultWidth = 400; 
            break;
          case 'timer': initialData = { time: 600 }; break;
          case 'traffic': initialData = { color: 'green' }; defaultWidth = 240; break;
          case 'work': initialData = { mode: 'whisper' }; defaultWidth = 320; break;
          case 'random': initialData = { names: "Alma, Oliver, Maja, William" }; break;
          case 'dice': initialData = { count: 2 }; defaultWidth = 300; break;
          case 'notes': initialData = { text: "" }; defaultWidth = 400; break;
          case 'qrcode': initialData = { url: "https://classroom.google.com" }; defaultWidth = 280; break;
        }

        const newWidget = {
          id: `${type}-${Date.now()}`, type,
          x: Math.random() * 100 + 50, y: Math.random() * 100 + 100,
          w: defaultWidth, z: topZ + 1, data: initialData 
        };
        setWidgets(prev => [...prev, newWidget]);
      };

      const handleReset = () => {
        if (!resetConfirm) { setResetConfirm(true); setTimeout(() => setResetConfirm(false), 3000); } 
        else { setWidgets([]); setResetConfirm(false); }
      };

      return (
        <div className="relative w-screen h-screen overflow-hidden text-slate-800 transition-all duration-300"
             style={{ background: bg.startsWith('linear') ? bg : `url(${bg}) center/cover no-repeat fixed` }}>
          <div className="absolute inset-0 bg-black/30 pointer-events-none" />

          {}
          <header className="absolute top-0 left-0 right-0 h-16 bg-black/40 backdrop-blur-md flex items-center justify-between px-6 z-50 text-white shadow-lg border-b border-white/10">
            <h1 className="font-extrabold text-xl tracking-wide flex items-center gap-2 drop-shadow-md">
              <span className="text-2xl">🏫</span> {t.appTitle}
            </h1>
            <div className="flex gap-2 items-center">
              <TopClock />
              <button onClick={() => setLang(lang === 'sv' ? 'en' : 'sv')} className="px-3 py-1.5 bg-white/10 hover:bg-white/20 rounded-xl text-xs font-bold transition active:scale-95 border border-white/20">
                {lang === 'sv' ? '🇸🇪 SV' : '🇬🇧 EN'}
              </button>
              <button onClick={() => setShowBgModal(true)} className="px-3 py-1.5 bg-white/10 hover:bg-white/20 rounded-xl text-xs font-bold transition active:scale-95 border border-white/20">
                🎨 {t.changeBg}
              </button>
              <button onClick={() => setShowCloudModal(true)} className="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-xs font-bold shadow-lg transition active:scale-95 flex items-center gap-2">
                {currentUser ? `☁️ ${currentUser.displayName?.split(' ')[0] || 'Mina Mallar'}` : `☁️ ${t.templates}`}
              </button>
              <button onClick={handleReset} className={`px-3 py-1.5 rounded-xl text-xs font-bold transition active:scale-95 border ${resetConfirm ? 'bg-red-600 text-white border-red-500 animate-pulse' : 'bg-white/10 hover:bg-white/20 text-white border-white/20'}`}>
                {resetConfirm ? t.sure : `🗑️ ${t.clear}`}
              </button>
            </div>
          </header>

          {}
          <main className="absolute inset-0 pt-16 pb-24 overflow-hidden">
            {widgets.map(widget => (
              <WidgetBox key={widget.id} widget={widget} title={t[widget.type] || widget.type} onDown={(e) => onPointerDown(widget.id, e)} onClose={() => removeWidget(widget.id)}>
                {widget.type === 'agenda' && <AgendaWidget data={widget.data} update={(d) => updateWidgetData(widget.id, d)} t={t} />}
                {widget.type === 'timer' && <TimerWidget data={widget.data} update={(d) => updateWidgetData(widget.id, d)} t={t} />}
                {widget.type === 'traffic' && <TrafficWidget data={widget.data} update={(d) => updateWidgetData(widget.id, d)} />}
                {widget.type === 'work' && <WorkModeWidget data={widget.data} update={(d) => updateWidgetData(widget.id, d)} t={t} />}
                {widget.type === 'random' && <RandomPickerWidget data={widget.data} update={(d) => updateWidgetData(widget.id, d)} t={t} />}
                {widget.type === 'dice' && <DiceWidget data={widget.data} update={(d) => updateWidgetData(widget.id, d)} t={t} />}
                {widget.type === 'notes' && <NotesWidget data={widget.data} update={(d) => updateWidgetData(widget.id, d)} />}
                {widget.type === 'qrcode' && <QrWidget data={widget.data} update={(d) => updateWidgetData(widget.id, d)} />}
              </WidgetBox>
            ))}
          </main>

          {}
          <footer className="absolute bottom-4 left-1/2 -translate-x-1/2 z-50 p-1.5">
            <div className="flex items-center gap-2 bg-slate-900/90 backdrop-blur-xl border border-white/20 px-4 py-2.5 rounded-2xl shadow-2xl">
              <DockIcon icon="📋" label={t.agenda} onClick={() => addWidget('agenda')} />
              <DockIcon icon="⏱️" label={t.timer} onClick={() => addWidget('timer')} />
              <DockIcon icon="🚦" label={t.traffic} onClick={() => addWidget('traffic')} />
              <DockIcon icon="👥" label={t.work} onClick={() => addWidget('work')} />
              <DockIcon icon="🔀" label={t.random} onClick={() => addWidget('random')} />
              <DockIcon icon="🎲" label={t.dice} onClick={() => addWidget('dice')} />
              <DockIcon icon="📝" label={t.notes} onClick={() => addWidget('notes')} />
              <DockIcon icon="📱" label={t.qrcode} onClick={() => addWidget('qrcode')} />
            </div>
          </footer>

          {showBgModal && <BgModal currentBg={bg} onSelect={(newBg) => { setBg(newBg); setShowBgModal(false); }} onClose={() => setShowBgModal(false)} t={t} />}
          {showCloudModal && <CloudModal t={t} widgets={widgets} bg={bg} user={currentUser} onClose={() => setShowCloudModal(false)} onLoad={(loadedWidgets, loadedBg) => { setWidgets(loadedWidgets); if (loadedBg) setBg(loadedBg); setShowCloudModal(false); }} />}
        </div>
      );
    }

    function CloudModal({ t, widgets, bg, user, onClose, onLoad }) {
      const [templates, setTemplates] = useState([]);
      const [newTemplateName, setNewTemplateName] = useState('');
      const [msg, setMsg] = useState('');
      const [loading, setLoading] = useState(false);
      const appId = 'whiteboard-klassrum';

      const fetchTemplates = async () => {
        if (!window.fbDb || !user) return;
        try {
          setLoading(true);
          const templatesRef = window.fbCollection(window.fbDb, 'artifacts', appId, 'public', 'data', 'templates');
          const snapshot = await window.fbGetDocs(templatesRef);
          
          const userTemplates = [];
          snapshot.forEach((doc) => {
            const data = doc.data();
            if (data.userId === user.uid) {
              userTemplates.push({ id: doc.id, ...data });
            }
          });
          
          setTemplates(userTemplates.sort((a, b) => b.createdAt - a.createdAt));
        } catch (error) {
          console.error("Kunde inte hämta mallar:", error);
          setMsg('❌ Fel vid hämtning av mallar.');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        if (user) fetchTemplates();
      }, [user]);

      const handleGoogleLogin = async () => {
        try {
          setMsg('');
          await window.fbSignInWithPopup(window.fbAuth, window.fbGoogleProvider);
        } catch (err) {
          console.error("Inloggningsfel:", err);
          setMsg('❌ Inloggningen avbröts eller misslyckades.');
        }
      };

      const handleLogout = async () => {
        try {
          await window.fbSignOut(window.fbAuth);
          setTemplates([]);
        } catch (err) {
          console.error("Fel vid utloggning:", err);
        }
      };

      const saveToCloud = async () => {
        if (!newTemplateName.trim() || !window.fbDb || !user) return;
        try {
          setMsg('Sparar till molnet...');
          const templatesRef = window.fbCollection(window.fbDb, 'artifacts', appId, 'public', 'data', 'templates');
          
          await window.fbAddDoc(templatesRef, {
            userId: user.uid,
            userName: user.displayName || user.email,
            userEmail: user.email,
            name: newTemplateName.trim(),
            widgets: widgets,
            bg: bg,
            createdAt: Date.now()
          });
          
          setNewTemplateName('');
          setMsg('✅ Sparad i molnet!');
          fetchTemplates();
          setTimeout(() => setMsg(''), 3000);
        } catch (error) {
          console.error("Kunde inte spara:", error);
          setMsg('❌ Något gick fel vid sparning.');
        }
      };

      const deleteTemplate = async (docId) => {
        if (!window.fbDb) return;
        try {
          await window.fbDeleteDoc(window.fbDoc(window.fbDb, 'artifacts', appId, 'public', 'data', 'templates', docId));
          fetchTemplates();
        } catch (error) {
          console.error("Kunde inte radera:", error);
        }
      };

      return (
        <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl animate-in fade-in zoom-in-95">
            <div className="flex justify-between items-center mb-5 pb-3 border-b border-slate-100">
              <h2 className="text-xl font-extrabold text-slate-800 flex items-center gap-2">☁️ {t.templates}</h2>
              <button onClick={onClose} className="w-8 h-8 flex items-center justify-center bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-full transition">✕</button>
            </div>

            {!user ? (
              <div className="text-center py-4 space-y-4">
                <div className="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-3xl mx-auto flex items-center justify-center text-3xl shadow-inner">
                  🔐
                </div>
                <h3 className="font-extrabold text-lg text-slate-800">Logga in med ditt Google-konto</h3>
                <p className="text-xs text-slate-500 font-medium leading-relaxed px-4">
                  Logga in med ditt skolkonto så följer alla dina sparade lektioner, timers och tavlor med dig automatiskt till vilket klassrum som helst.
                </p>
                <button
                  onClick={handleGoogleLogin}
                  className="w-full flex items-center justify-center gap-3 bg-white border-2 border-slate-200 hover:border-slate-400 hover:bg-slate-50 text-slate-700 font-bold py-3 px-4 rounded-2xl shadow-sm transition active:scale-95"
                >
                  <svg className="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                  </svg>
                  <span>Fortsätt med Google</span>
                </button>
                {msg && <div className="text-xs font-bold text-red-600 bg-red-50 p-2.5 rounded-xl border border-red-200">{msg}</div>}
              </div>
            ) : (
              <div>
                <div className="flex justify-between items-center mb-4 p-2.5 bg-slate-50 border border-slate-200 rounded-2xl">
                  <div className="flex items-center gap-2.5 overflow-hidden">
                    {user.photoURL ? (
                      <img src={user.photoURL} alt="Profil" className="w-8 h-8 rounded-full border border-slate-300" />
                    ) : (
                      <div className="w-8 h-8 rounded-full bg-indigo-600 text-white font-bold flex items-center justify-center text-xs">
                        {(user.displayName || user.email || 'L')[0].toUpperCase()}
                      </div>
                    )}
                    <div className="truncate">
                      <span className="font-extrabold text-xs text-slate-800 block truncate">{user.displayName || 'Lärare'}</span>
                      <span className="text-[10px] text-slate-400 block truncate">{user.email}</span>
                    </div>
                  </div>
                  <button onClick={handleLogout} className="text-xs font-bold text-slate-500 hover:text-rose-600 px-2 py-1 rounded-lg hover:bg-slate-200 transition">
                    Logga ut
                  </button>
                </div>

                <div className="flex gap-2 mb-4">
                  <input type="text" value={newTemplateName} onChange={e => setNewTemplateName(e.target.value)} placeholder={t.templateName} className="flex-1 px-3 py-2.5 text-sm border-2 border-slate-200 rounded-xl outline-none focus:border-indigo-500 font-medium" />
                  <button onClick={saveToCloud} disabled={!newTemplateName.trim()} className="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white rounded-xl text-sm font-bold shadow-md transition active:scale-95">{t.saveTemplate}</button>
                </div>
                
                {msg && <div className={`text-xs font-bold mb-4 p-2.5 rounded-xl border ${msg.includes('❌') ? 'bg-red-50 text-red-600 border-red-200' : 'bg-emerald-50 text-emerald-600 border-emerald-200'}`}>{msg}</div>}

                <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
                  {loading && <div className="text-center py-6 text-xs text-slate-400 font-medium">Hämtar dina lektioner...</div>}
                  {!loading && templates.length === 0 && <div className="text-center py-8 text-sm text-slate-400 font-medium">Du har inga sparade lektioner i molnet ännu.</div>}
                  {templates.map(tpl => (
                    <div key={tpl.id} className="flex items-center justify-between p-3.5 bg-slate-50 border border-slate-200 rounded-2xl hover:bg-slate-100 transition">
                      <div>
                        <span className="font-bold text-sm text-slate-800 block">{tpl.name}</span>
                        <span className="text-xs text-slate-500 font-medium">{tpl.widgets?.length || 0} block</span>
                      </div>
                      <div className="flex gap-2">
                        <button onClick={() => onLoad(tpl.widgets, tpl.bg)} className="px-3.5 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs rounded-xl shadow-sm transition active:scale-95">{t.loadTemplate}</button>
                        <button onClick={() => deleteTemplate(tpl.id)} className="w-8 h-8 flex items-center justify-center bg-rose-100 hover:bg-rose-200 text-rose-700 rounded-xl transition">🗑️</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function BgModal({ currentBg, onSelect, onClose, t }) {
      return (
        <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl p-6 w-full max-w-lg shadow-2xl animate-in fade-in">
            <div className="flex justify-between items-center mb-5 pb-2 border-b border-slate-100">
              <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">🎨 {t.changeBg}</h2>
              <button onClick={onClose} className="w-8 h-8 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded-full">✕</button>
            </div>
            <div className="grid grid-cols-2 gap-3 mb-5 max-h-64 overflow-y-auto">
              {BACKGROUNDS.map((b, i) => (
                <button key={i} onClick={() => onSelect(b.url)} className={`h-28 rounded-2xl overflow-hidden relative border-4 text-left flex items-end transition ${currentBg === b.url ? 'border-indigo-500' : 'border-transparent hover:border-slate-300'}`} style={{ background: b.url.includes('gradient') ? b.url : `url(${b.url}) center/cover` }}>
                  <span className="text-white text-xs font-bold drop-shadow-md bg-black/50 px-2.5 py-1 rounded-tr-lg w-full truncate">{b.name}</span>
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function WidgetBox({ widget, title, onDown, onClose, children }) {
      return (
        <div className="absolute glass-panel rounded-3xl flex flex-col overflow-hidden shadow-xl" style={{ transform: `translate3d(${widget.x}px, ${widget.y}px, 0)`, width: widget.w, zIndex: widget.z }}>
          <div onMouseDown={onDown} onTouchStart={onDown} className="flex justify-between items-center px-5 py-3 bg-slate-100/80 border-b border-slate-200 cursor-grab active:cursor-grabbing">
            <span className="font-extrabold text-xs uppercase tracking-widest text-slate-600 pointer-events-none">{title}</span>
            <button onClick={onClose} className="text-slate-400 hover:text-rose-600 hover:bg-rose-100 w-7 h-7 flex items-center justify-center rounded-full transition">✕</button>
          </div>
          <div className="p-5 flex-1 overflow-auto">{children}</div>
        </div>
      );
    }

    function DockIcon({ icon, label, onClick }) {
      return (
        <button onClick={onClick} className="flex flex-col items-center justify-center w-16 h-16 rounded-2xl hover:bg-white/15 text-white transition active:scale-95 group">
          <span className="text-2xl mb-1 group-hover:scale-110 transition-transform">{icon}</span>
          <span className="text-[10px] uppercase font-bold tracking-wider opacity-70 group-hover:opacity-100">{label}</span>
        </button>
      );
    }

    function TopClock() {
      const [time, setTime] = useState(new Date());
      useEffect(() => { const timer = setInterval(() => setTime(new Date()), 1000); return () => clearInterval(timer); }, []);
      return <div className="text-sm font-bold bg-white/10 px-4 py-1.5 rounded-xl border border-white/20 tracking-wider">{time.toLocaleTimeString([], { hour: '2-digit', minute:'2-digit' })}</div>;
    }

    const AGENDA_ICONS = [
      { icon: "📋", label: "Närvaro" },
      { icon: "📖", label: "Läsning" },
      { icon: "✍️", label: "Skriva" },
      { icon: "🗣️", label: "Samtala" },
      { icon: "👥", label: "Grupparbete" },
      { icon: "💻", label: "Chromebook / Dator" },
      { icon: "📐", label: "Matematik" },
      { icon: "🎨", label: "Skapa / Bild" },
      { icon: "🧪", label: "Laboration" },
      { icon: "🎧", label: "Lyssna" },
      { icon: "⭐", label: "Mål" },
      { icon: "🔔", label: "Rast / Avslut" }
    ];

    function AgendaWidget({ data, update, t }) {
      const items = data.items || [];
      const [input, setInput] = useState("");
      const [selectedIcon, setSelectedIcon] = useState("📋");
      
      const toggle = (id) => update({ items: items.map(it => it.id === id ? { ...it, done: !it.done } : it) });
      const remove = (id) => {
        const newItems = items.filter(it => it.id !== id);
        update({ items: newItems }); 
      };
      
      const cycleIcon = (id) => {
        const nextItems = items.map(it => {
          if (it.id !== id) return it;
          const currentIdx = AGENDA_ICONS.findIndex(x => x.icon === (it.icon || "📋"));
          const nextIdx = (currentIdx + 1) % AGENDA_ICONS.length;
          return { ...it, icon: AGENDA_ICONS[nextIdx].icon };
        });
        update({ items: nextItems });
      };

      const add = (e) => { 
        e.preventDefault(); 
        if (input.trim()) { 
          update({ 
            items: [
              ...items, 
              { 
                id: Date.now() + Math.random(), 
                text: input.trim(), 
                icon: selectedIcon, 
                done: false 
              }
            ] 
          }); 
          setInput(''); 
        } 
      };

      return (
        <div className="space-y-4">
          <ul className="space-y-2 max-h-60 overflow-y-auto pr-1">
            {items.length === 0 && <p className="text-sm text-slate-400 italic text-center py-6">{t.emptyAgenda}</p>}
            {items.map(it => (
              <li key={it.id} className={`flex items-center justify-between p-2.5 rounded-2xl border-2 transition ${it.done ? 'bg-slate-50 opacity-60 border-transparent' : 'bg-white shadow-sm border-slate-100 hover:border-slate-200'}`}>
                <div className="flex items-center gap-2.5 overflow-hidden flex-1">
                  {/* Kryssruta */}
                  <div 
                    onClick={() => toggle(it.id)} 
                    className={`w-6 h-6 rounded-lg flex items-center justify-center text-xs font-bold cursor-pointer transition-colors shrink-0 ${it.done ? 'bg-emerald-500 text-white' : 'bg-slate-100 border border-slate-300 hover:bg-slate-200 text-transparent'}`}
                  >
                    ✓
                  </div>
                  
                  {/* Gullig klickbar ikon som kan bytas */}
                  <button 
                    type="button"
                    onClick={() => cycleIcon(it.id)} 
                    title="Klicka för att byta symbol" 
                    className="w-9 h-9 flex items-center justify-center text-xl bg-slate-100 hover:bg-indigo-100 hover:scale-110 active:scale-95 rounded-xl border border-slate-200/80 transition-all shrink-0 cursor-pointer"
                  >
                    {it.icon || "📋"}
                  </button>

                  {/* Lektionstext */}
                  <span 
                    onClick={() => toggle(it.id)} 
                    className={`text-sm font-bold truncate cursor-pointer select-none ${it.done ? 'line-through text-slate-400' : 'text-slate-800'}`}
                  >
                    {it.text}
                  </span>
                </div>

                {/* Ta bort-knapp */}
                <button 
                  onClick={() => remove(it.id)} 
                  title="Ta bort punkt"
                  className="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition ml-2 shrink-0"
                >
                  🗑️
                </button>
              </li>
            ))}
          </ul>

          {/* Formulär för att lägga till ny punkt med ikonväljare */}
          <form onSubmit={add} className="flex gap-2 items-center">
            <div className="relative">
              <select 
                value={selectedIcon} 
                onChange={e => setSelectedIcon(e.target.value)} 
                title="Välj symbol för momentet"
                className="appearance-none bg-slate-100 hover:bg-slate-200 text-lg px-2.5 py-2 rounded-xl border-2 border-slate-200 outline-none cursor-pointer focus:border-indigo-500 transition text-center"
              >
                {AGENDA_ICONS.map(item => (
                  <option key={item.icon} value={item.icon}>
                    {item.icon} {item.label}
                  </option>
                ))}
              </select>
            </div>
            <input 
              type="text" 
              value={input} 
              onChange={e => setInput(e.target.value)} 
              placeholder={t.placeholder} 
              className="flex-1 text-sm font-medium px-4 py-2 border-2 border-slate-200 rounded-xl outline-none focus:border-indigo-500 bg-white" 
            />
            <button 
              type="submit" 
              className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl font-bold transition active:scale-95 text-sm shrink-0 shadow-sm"
            >
              {t.add}
            </button>
          </form>
        </div>
      );
    }

    function TimerWidget({ data, update, t }) {
      const initialTime = data.time || 600;
      const [time, setTime] = useState(initialTime);
      const [running, setRunning] = useState(false);

      useEffect(() => {
        let timer;
        if (running && time > 0) timer = setInterval(() => setTime(prev => prev - 1), 1000);
        else if (running && time === 0) setRunning(false);
        return () => clearInterval(timer);
      }, [running, time]);

      const format = (sec) => `${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`;
      const handleSet = (mins) => { update({ time: mins * 60 }); setTime(mins * 60); setRunning(false); };

      return (
        <div className="text-center">
          <div className="bg-slate-900 text-white rounded-3xl p-6 shadow-inner mb-4 border-b-4 border-slate-700">
            <div className="text-6xl font-mono font-extrabold tracking-tight text-emerald-400">{format(time)}</div>
          </div>
          <div className="flex gap-3 justify-center mb-4">
            <button onClick={() => setRunning(!running)} className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-2xl text-sm font-bold shadow-md transition active:scale-95">{running ? t.pause : t.start}</button>
            <button onClick={() => { setTime(initialTime); setRunning(false); }} className="px-5 bg-slate-200 hover:bg-slate-300 text-slate-800 py-3 rounded-2xl text-sm font-bold transition active:scale-95">{t.reset}</button>
          </div>
          <div className="flex gap-2">
            {[1, 5, 10, 15].map(m => (
              <button key={m} onClick={() => handleSet(m)} className="flex-1 text-xs bg-white hover:bg-slate-100 border-2 border-slate-200 text-slate-700 py-2 rounded-xl font-bold transition active:scale-95">+{m}m</button>
            ))}
          </div>
        </div>
      );
    }

    function TrafficWidget({ data, update }) {
      const active = data.color || 'green';
      const changeColor = (c) => update({ color: c });
      return (
        <div className="flex flex-col items-center">
          <div className="bg-slate-900 p-5 rounded-[40px] flex flex-col gap-4 shadow-xl border-4 border-slate-800">
            <button onClick={() => changeColor('red')} className={`w-16 h-16 rounded-full transition-all duration-300 ${active === 'red' ? 'bg-red-500 shadow-[0_0_30px_rgba(239,68,68,1)]' : 'bg-red-950/40 hover:bg-red-900/60'}`} />
            <button onClick={() => changeColor('yellow')} className={`w-16 h-16 rounded-full transition-all duration-300 ${active === 'yellow' ? 'bg-yellow-400 shadow-[0_0_30px_rgba(250,204,21,1)]' : 'bg-yellow-950/40 hover:bg-yellow-900/60'}`} />
            <button onClick={() => changeColor('green')} className={`w-16 h-16 rounded-full transition-all duration-300 ${active === 'green' ? 'bg-emerald-500 shadow-[0_0_30px_rgba(16,185,129,1)]' : 'bg-green-950/40 hover:bg-green-900/60'}`} />
          </div>
        </div>
      );
    }

    function WorkModeWidget({ data, update, t }) {
      const mode = data.mode || 'whisper';
      const modes = [{ id: 'silence', icon: '🤫', label: t.silence }, { id: 'whisper', icon: '🗣️', label: t.whisper }, { id: 'ask', icon: '👥', label: t.ask }, { id: 'group', icon: '🤝', label: t.group }];
      return (
        <div className="grid grid-cols-2 gap-3">
          {modes.map(m => (
            <button key={m.id} onClick={() => update({ mode: m.id })} className={`p-4 rounded-2xl flex flex-col items-center justify-center border-2 transition-all ${mode === m.id ? 'bg-indigo-50 border-indigo-500 shadow-md text-indigo-900 scale-105' : 'bg-white border-slate-100 hover:border-slate-300 text-slate-500'}`}>
              <span className="text-3xl mb-2">{m.icon}</span><span className="text-xs font-extrabold uppercase tracking-wide">{m.label}</span>
            </button>
          ))}
        </div>
      );
    }

    function RandomPickerWidget({ data, update, t }) {
      const namesStr = data.names || "Alma, Oliver, Maja, William, Elsa, Liam";
      const [selected, setSelected] = useState("?");
      const [rolling, setRolling] = useState(false);
      const [isEditing, setIsEditing] = useState(false);

      const pick = () => {
        const arr = namesStr.split(/[,\n]/).map(n => n.trim()).filter(Boolean);
        if (arr.length === 0 || rolling) return;
        setRolling(true);
        let ticks = 0;
        const interval = setInterval(() => {
          setSelected(arr[Math.floor(Math.random() * arr.length)]);
          ticks++;
          if (ticks > 15) { clearInterval(interval); setRolling(false); }
        }, 80);
      };

      return (
        <div className="flex flex-col items-center">
          {isEditing ? (
            <div className="w-full space-y-3">
              <textarea value={namesStr} onChange={(e) => update({ names: e.target.value })} rows="5" className="w-full text-sm font-medium p-3 border-2 border-slate-200 rounded-2xl outline-none focus:border-indigo-500 text-slate-700" placeholder="Namn separerade med kommatecken..." />
              <button onClick={() => setIsEditing(false)} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-sm font-bold transition">OK</button>
            </div>
          ) : (
            <div className="w-full relative">
              <button onClick={() => setIsEditing(true)} className="absolute top-3 right-3 text-sm text-white/70 hover:text-white bg-black/20 hover:bg-black/40 px-2.5 py-1.5 rounded-xl transition">⚙️</button>
              <div className="w-full py-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-3xl text-white shadow-inner mb-4 flex items-center justify-center">
                <div className={`text-4xl font-extrabold tracking-wide ${rolling ? 'scale-110 animate-pulse' : ''}`}>{selected}</div>
              </div>
              <button onClick={pick} disabled={rolling} className="bg-slate-900 hover:bg-slate-800 text-white px-4 py-3.5 rounded-2xl font-bold text-sm w-full transition active:scale-95 shadow-lg uppercase tracking-wider">{t.chooseRandom}</button>
            </div>
          )}
        </div>
      );
    }

    function DiceWidget({ data, update, t }) {
      const count = data.count || 2;
      const [dice, setDice] = useState(Array.from({ length: count }, () => 1));
      const [rolling, setRolling] = useState(false);

      const roll = () => {
        if (rolling) return;
        setRolling(true);
        let ticks = 0;
        const interval = setInterval(() => {
          setDice(Array.from({ length: count }, () => Math.floor(Math.random() * 6) + 1));
          ticks++;
          if (ticks > 10) { clearInterval(interval); setRolling(false); }
        }, 60);
      };

      return (
        <div className="text-center space-y-4">
          <div className="flex justify-center gap-4 py-4 min-h-[100px] items-center">
            {dice.map((val, i) => (
              <div key={i} className={`w-16 h-16 bg-white border-4 border-slate-800 rounded-2xl shadow-lg flex items-center justify-center text-3xl font-black text-slate-800 transition-transform ${rolling ? 'rotate-12 scale-110 bg-indigo-50' : ''}`}>{val}</div>
            ))}
          </div>
          <div className="flex justify-center gap-2">
            {[1, 2, 3].map(n => (
              <button key={n} onClick={() => { update({ count: n }); setDice(Array.from({ length: n }, () => 1)); }} className={`px-4 py-1.5 rounded-xl text-xs font-extrabold border-2 transition ${count === n ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-600 border-slate-200 hover:border-slate-400'}`}>{n}</button>
            ))}
          </div>
          <button onClick={roll} disabled={rolling} className="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-3 rounded-2xl text-sm font-extrabold shadow-lg transition active:scale-95 tracking-wide uppercase">{t.rollDice}</button>
        </div>
      );
    }

    function NotesWidget({ data, update }) {
      return (
        <div className="h-full flex flex-col min-h-[200px]">
          <textarea value={data.text || ""} onChange={e => update({ text: e.target.value })} placeholder="Skriv anteckningar här..." className="w-full flex-1 p-4 bg-amber-50/50 border-2 border-amber-200 rounded-2xl outline-none resize-none text-sm font-medium text-slate-800 focus:border-amber-400 transition-colors" />
        </div>
      );
    }

    function QrWidget({ data, update }) {
      const [urlInput, setUrlInput] = useState(data.url || "https://classroom.google.com");
      const submit = (e) => { e.preventDefault(); update({ url: urlInput }); };
      const imgSrc = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(data.url || "https://classroom.google.com")}`;
      
      return (
        <div className="flex flex-col items-center space-y-4">
          <div className="p-3 bg-white border-2 border-slate-100 rounded-3xl shadow-sm"><img src={imgSrc} alt="QR" className="w-40 h-40 rounded-xl" /></div>
          <form onSubmit={submit} className="w-full flex gap-2">
            <input type="text" value={urlInput} onChange={(e) => setUrlInput(e.target.value)} placeholder="https://..." className="flex-1 px-3 py-2 text-xs font-medium border-2 border-slate-200 rounded-xl outline-none focus:border-indigo-500 text-slate-700" />
            <button type="submit" className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition">OK</button>
          </form>
        </div>
      );
    }

    // Starta React
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
