<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klassrumsskärm</title>
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel för JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #f8fafc; 
            font-family: 'Outfit', sans-serif; 
            user-select: none;
        }
        .bg-image { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            object-fit: cover; 
            z-index: 0; 
        }
        .widget { 
            position: absolute; 
            background: white; 
            border-radius: 20px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            transition: box-shadow 0.2s, border-color 0.2s;
        }
        .widget-clean {
            box-shadow: 0 8px 24px -4px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .widget-selected {
            box-shadow: 0 16px 36px -6px rgba(111, 129, 102, 0.25);
            border: 2px solid #6F8166;
        }
        .widget-header { 
            background: #f8fafc; 
            padding: 8px 14px; 
            cursor: grab; 
            font-weight: 700; 
            border-bottom: 1px solid #e2e8f0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            touch-action: none; 
            font-size: 13px;
            color: #334155;
        }
        .widget-header:active { cursor: grabbing; }
        .resize-handle { 
            position: absolute; 
            bottom: 0; 
            right: 0; 
            width: 24px; 
            height: 24px; 
            cursor: nwse-resize; 
            display: flex; 
            align-items: flex-end; 
            justify-content: flex-end; 
            padding: 3px; 
            color: #6F8166; 
            touch-action: none; 
            z-index: 30;
        }
        .dock { 
            position: absolute; 
            bottom: 16px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: #1e293b; 
            padding: 8px 18px; 
            border-radius: 24px; 
            display: flex; 
            gap: 12px; 
            box-shadow: 0 16px 32px rgba(0,0,0,0.3); 
            z-index: 50; 
            max-width: 96vw; 
            overflow-x: auto; 
        }
        .dock-btn { 
            background: none; 
            border: none; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 3px; 
            cursor: pointer; 
            transition: transform 0.15s, color 0.15s; 
            white-space: nowrap; 
        }
        .dock-btn:hover { transform: translateY(-3px); color: #9CAE91; }
        .dock-icon { font-size: 20px; line-height: 1; }
        .dock-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600; opacity: 0.9; }
        
        .sticker { 
            position: absolute; 
            user-select: none; 
            display: inline-block; 
            touch-action: none; 
            z-index: 40 !important; 
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, setDoc, onSnapshot, query, where, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCjnV83LrQ-I-5WMf-6EJ9xqV5xnufO6LQ",
            authDomain: "whiteboard-klassrum.firebaseapp.com",
            projectId: "whiteboard-klassrum",
            storageBucket: "whiteboard-klassrum.firebasestorage.app",
            messagingSenderId: "298760316508",
            appId: "1:298760316508:web:55608b567db408f14ae899"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseApp = { auth, db, signInWithPopup, GoogleAuthProvider, signInAnonymously, onAuthStateChanged, signOut, collection, addDoc, setDoc, onSnapshot, query, where, deleteDoc, doc };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Elevvyer ---
        const urlParams = new URLSearchParams(window.location.search);
        const isStudent = urlParams.get('student');
        
        if (isStudent === 'checkin') {
            const StudentCheckIn = () => {
                const question = urlParams.get('q') || 'Hur mår du idag?';
                const boardId = urlParams.get('boardId');
                const [sent, setSent] = useState(false);
                useEffect(() => { window.firebaseApp.signInAnonymously(window.firebaseApp.auth); }, []);
                const sendReaction = async (emoji) => {
                    if(!boardId) return;
                    await window.firebaseApp.addDoc(window.firebaseApp.collection(window.firebaseApp.db, 'checkins'), { boardId, emoji, timestamp: new Date() });
                    setSent(true);
                };
                if (sent) return <div className="p-10 text-center text-2xl font-bold mt-20 text-emerald-800">Tack för ditt svar! ✨</div>;
                return (
                    <div className="p-6 max-w-md mx-auto mt-10 text-center">
                        <h1 className="text-3xl font-bold mb-10 text-slate-800">{question}</h1>
                        <div className="grid grid-cols-2 gap-6">
                            {['🤩', '🙂', '😐', '😔'].map(emoji => (
                                <button key={emoji} onClick={() => sendReaction(emoji)} className="text-7xl bg-white p-6 rounded-3xl shadow-md border active:scale-95 transition-transform">{emoji}</button>
                            ))}
                        </div>
                    </div>
                );
            };
            ReactDOM.createRoot(document.getElementById('root')).render(<StudentCheckIn />);
        } 
        else if (isStudent === 'exitticket') {
            const StudentExitTicket = () => {
                const question = urlParams.get('q') || 'Din kommentar?';
                const boardId = urlParams.get('boardId');
                const [name, setName] = useState('');
                const [text, setText] = useState('');
                const [sent, setSent] = useState(false);
                useEffect(() => { window.firebaseApp.signInAnonymously(window.firebaseApp.auth); }, []);
                const sendTicket = async () => {
                    if(!boardId || !name || !text) return;
                    await window.firebaseApp.addDoc(window.firebaseApp.collection(window.firebaseApp.db, 'exittickets'), { boardId, name, text, timestamp: new Date() });
                    setSent(true);
                };
                if (sent) return <div className="p-10 text-center text-2xl font-bold mt-20 text-emerald-800">Skickat! Kolla på tavlan. 📌</div>;
                return (
                    <div className="p-6 max-w-md mx-auto mt-10 flex flex-col gap-4">
                        <h1 className="text-2xl font-bold text-center mb-6 text-slate-800">{question}</h1>
                        <input type="text" placeholder="Ditt namn" className="p-4 border-2 border-slate-200 rounded-xl text-lg outline-none focus:border-emerald-600" value={name} onChange={e => setName(e.target.value)} />
                        <textarea placeholder="Ditt svar..." className="p-4 border-2 border-slate-200 rounded-xl text-lg h-32 outline-none focus:border-emerald-600" value={text} onChange={e => setText(e.target.value)} />
                        <button onClick={sendTicket} className="bg-[#6F8166] text-white font-bold text-xl py-4 rounded-xl mt-4 shadow-md">Skicka in</button>
                    </div>
                );
            };
            ReactDOM.createRoot(document.getElementById('root')).render(<StudentExitTicket />);
        }
        else {
            // --- Drag-hook ---
            const useDraggable = (initialPos, onDragEnd) => {
                const [pos, setPos] = useState(initialPos);
                const posRef = useRef(pos);
                posRef.current = pos;

                useEffect(() => {
                    if (initialPos) setPos(initialPos);
                }, [initialPos?.x, initialPos?.y]);

                const handleDrag = (e) => {
                    if (e.target.tagName === 'BUTTON' || e.target.closest('button') || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'IFRAME') return;
                    
                    if (e.type === 'touchstart') {
                        const touch = e.touches[0];
                        let startX = touch.clientX - posRef.current.x;
                        let startY = touch.clientY - posRef.current.y;
                        let currentPos = { ...posRef.current };

                        const onTouchMove = (mE) => {
                            if (mE.cancelable) mE.preventDefault();
                            currentPos = {
                                x: Math.max(0, mE.touches[0].clientX - startX),
                                y: Math.max(0, mE.touches[0].clientY - startY)
                            };
                            setPos(currentPos);
                        };

                        const onTouchEnd = () => {
                            document.removeEventListener('touchmove', onTouchMove);
                            document.removeEventListener('touchend', onTouchEnd);
                            if (onDragEnd) onDragEnd(currentPos);
                        };

                        document.addEventListener('touchmove', onTouchMove, { passive: false });
                        document.addEventListener('touchend', onTouchEnd);
                    } else {
                        let startX = e.clientX - posRef.current.x;
                        let startY = e.clientY - posRef.current.y;
                        let currentPos = { ...posRef.current };

                        const onMouseMove = (mE) => {
                            currentPos = {
                                x: Math.max(0, mE.clientX - startX),
                                y: Math.max(0, mE.clientY - startY)
                            };
                            setPos(currentPos);
                        };

                        const onMouseUp = () => {
                            document.removeEventListener('mousemove', onMouseMove);
                            document.removeEventListener('mouseup', onMouseUp);
                            if (onDragEnd) onDragEnd(currentPos);
                        };

                        document.addEventListener('mousemove', onMouseMove);
                        document.addEventListener('mouseup', onMouseUp);
                    }
                };
                return [pos, handleDrag, setPos];
            };

            const defaultLayout = {
                clock: { x: 50, y: 80, w: 260, h: 180 },
                timer: { x: 330, y: 80, w: 280, h: 200 },
                timetimer: { x: 50, y: 280, w: 290, h: 360 },
                bildstod: { x: 360, y: 300, w: 320, h: 340 },
                youtube: { x: 700, y: 80, w: 460, h: 330 },
                agenda: { x: 50, y: 280, w: 360, h: 460 },
                notes: { x: 700, y: 430, w: 380, h: 260 },
                dice: { x: 400, y: 460, w: 280, h: 320 },
                workformat: { x: 700, y: 400, w: 330, h: 360 },
                randomizer: { x: 1050, y: 80, w: 320, h: 320 },
                group: { x: 1050, y: 420, w: 400, h: 440 },
                checkin: { x: 400, y: 150, w: 380, h: 440 },
                exitticket: { x: 450, y: 150, w: 500, h: 480 }
            };

            const App = () => {
                const [bg, setBg] = useState('#FFFFFF');
                const [widgets, setWidgets] = useState({ 
                    clock: false, 
                    timer: false, 
                    timetimer: false, 
                    bildstod: false, 
                    youtube: false, 
                    agenda: false, 
                    notes: false, 
                    dice: false, 
                    workformat: false, 
                    randomizer: false, 
                    group: false, 
                    checkin: false, 
                    exitticket: false 
                });
                const [widgetLayout, setWidgetLayout] = useState(defaultLayout);
                
                // Aktivt vald widget & sticker
                const [selectedWidgetKey, setSelectedWidgetKey] = useState(null);
                const [selectedStickerId, setSelectedStickerId] = useState(null);

                // Nuvarande mall
                const [currentLoadedTemplate, setCurrentLoadedTemplate] = useState(null);

                // Innehåll och data
                const [stickers, setStickers] = useState([]);
                const [agendaItems, setAgendaItems] = useState([
                    { id: 1, icon: '📖', text: 'Tyst läsning', done: false },
                    { id: 2, icon: '✍️', text: 'Gemensam genomgång', done: false }
                ]);
                const [notesText, setNotesText] = useState('');
                const [workFormatIdx, setWorkFormatIdx] = useState(0);
                const [timerSeconds, setTimerSeconds] = useState(5 * 60);
                const [timeTimerMinutes, setTimeTimerMinutes] = useState(15);
                const [bildstodData, setBildstodData] = useState({ tag: 'NU', icon: '👂', label: 'Lyssna' });
                const [youtubeUrl, setYoutubeUrl] = useState('');
                const [namesList, setNamesList] = useState("Anna, Björn, Cecilia, David, Elin, Filip, Greta, Hugo, Ida, Johan");
                const [createdGroups, setCreatedGroups] = useState([]);
                const [numGroups, setNumGroups] = useState(2);
                const [randomizerChosen, setRandomizerChosen] = useState(null);
                const [checkInQuestion, setCheckInQuestion] = useState("Hur mår du idag?");
                const [checkInActive, setCheckInActive] = useState(false);
                const [exitTicketQuestion, setExitTicketQuestion] = useState("Vad tar du med dig från lektionen?");
                const [exitTicketActive, setExitTicketActive] = useState(false);

                // Menyer
                const [showStickerMenu, setShowStickerMenu] = useState(false);
                const [showBgMenu, setShowBgMenu] = useState(false);
                const [showCloudMenu, setShowCloudMenu] = useState(false);
                
                const [user, setUser] = useState(null);
                const [templates, setTemplates] = useState([]);
                
                const boardIdRef = useRef("board_" + Math.random().toString(36).substr(2, 9));
                const baseUrl = window.location.href.split('?')[0];

                const toggleWidget = (w) => {
                    setWidgets(prev => {
                        const next = !prev[w];
                        if (next) {
                            setSelectedWidgetKey(w);
                            setSelectedStickerId(null);
                        }
                        return { ...prev, [w]: next };
                    });
                };

                const updateLayout = (wKey, updateData) => {
                    setWidgetLayout(prev => ({
                        ...prev,
                        [wKey]: { ...prev[wKey], ...updateData }
                    }));
                };
                
                useEffect(() => {
                    const unsubscribe = window.firebaseApp.onAuthStateChanged(window.firebaseApp.auth, currentUser => {
                        if (currentUser && !currentUser.isAnonymous) {
                            setUser(currentUser);
                            const q = window.firebaseApp.query(window.firebaseApp.collection(window.firebaseApp.db, "templates"), window.firebaseApp.where("userId", "==", currentUser.uid));
                            window.firebaseApp.onSnapshot(q, snap => {
                                let tmp = [];
                                snap.docs.forEach(doc => tmp.push({id: doc.id, ...doc.data()}));
                                setTemplates(tmp);
                            });
                        } else {
                            setUser(null);
                            setTemplates([]);
                        }
                    });
                    return () => unsubscribe();
                }, []);

                const handleLogin = () => {
                    window.firebaseApp.signInWithPopup(window.firebaseApp.auth, new window.firebaseApp.GoogleAuthProvider())
                    .catch(() => alert("Inloggning misslyckades."));
                };

                const handleLogout = () => { 
                    window.firebaseApp.signOut(window.firebaseApp.auth); 
                    setCurrentLoadedTemplate(null);
                };

                const handleImageUpload = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 1280;
                            const scale = Math.min(1, MAX_WIDTH / img.width);
                            canvas.width = img.width * scale;
                            canvas.height = img.height * scale;

                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.55);
                            setBg(compressedBase64);
                            setShowBgMenu(false);
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                };

                // SPARA MALL: Skriv över eller spara som ny
                const saveTemplate = async () => {
                    if (!user) {
                        alert("Logga in med Google först för att spara mallar!");
                        return;
                    }

                    let finalName = '';
                    let overwriteId = null;

                    if (currentLoadedTemplate && currentLoadedTemplate.id) {
                        const answer = confirm(
                            `Vill du skriva över den öppnade mallen "${currentLoadedTemplate.name}"?\n\n` +
                            `• Klicka OK för att SKRIVA ÖVER den gamla mallen.\n` +
                            `• Klicka AVBRYT för att SPARA SOM ETT NYTT NAMN.`
                        );

                        if (answer) {
                            finalName = currentLoadedTemplate.name;
                            overwriteId = currentLoadedTemplate.id;
                        } else {
                            const newName = prompt("Ange ett nytt namn för mallen:", currentLoadedTemplate.name + " (kopia)");
                            if (!newName || newName.trim() === '') return;
                            finalName = newName.trim();
                        }
                    } else {
                        const enteredName = prompt("Namnge denna tavla (t.ex. 'Svenska Åk 7'):");
                        if (!enteredName || enteredName.trim() === '') return;
                        finalName = enteredName.trim();
                    }

                    const activeWidgets = Object.keys(widgets).filter(k => widgets[k]);
                    
                    const templatePayload = {
                        userId: user.uid,
                        name: finalName,
                        bg: bg || '#FFFFFF',
                        activeWidgets: activeWidgets,
                        widgetLayout: widgetLayout,
                        stickers: stickers,
                        agendaItems: agendaItems,
                        notesText: notesText || '',
                        workFormatIdx: Number(workFormatIdx) || 0,
                        timerSeconds: Number(timerSeconds) || 300,
                        timeTimerMinutes: Number(timeTimerMinutes) || 15,
                        bildstodData: bildstodData,
                        youtubeUrl: youtubeUrl || '',
                        namesList: namesList || '',
                        createdGroupsJson: JSON.stringify(createdGroups || []),
                        numGroups: Number(numGroups) || 2,
                        randomizerChosen: randomizerChosen || null,
                        checkInQuestion: checkInQuestion || '',
                        checkInActive: Boolean(checkInActive),
                        exitTicketQuestion: exitTicketQuestion || '',
                        exitTicketActive: Boolean(exitTicketActive),
                        timestamp: new Date()
                    };

                    try {
                        if (overwriteId) {
                            await window.firebaseApp.setDoc(window.firebaseApp.doc(window.firebaseApp.db, "templates", overwriteId), templatePayload);
                            setCurrentLoadedTemplate({ id: overwriteId, ...templatePayload });
                            alert(`Mallen "${finalName}" har skrivits över och uppdaterats i molnet! ☁️`);
                        } else {
                            const docRef = await window.firebaseApp.addDoc(window.firebaseApp.collection(window.firebaseApp.db, "templates"), templatePayload);
                            setCurrentLoadedTemplate({ id: docRef.id, ...templatePayload });
                            alert(`Mallen "${finalName}" har sparats som ny i molnet! ☁️`);
                        }
                    } catch (err) {
                        alert("Kunde inte spara till molnet: " + err.message);
                    }
                };

                const loadTemplate = (tmpl) => {
                    setCurrentLoadedTemplate(tmpl);
                    if (tmpl.bg) setBg(tmpl.bg);
                    
                    let newWidgets = { clock: false, timer: false, timetimer: false, bildstod: false, youtube: false, agenda: false, notes: false, dice: false, workformat: false, randomizer: false, group: false, checkin: false, exitticket: false };
                    if(tmpl.activeWidgets) {
                        tmpl.activeWidgets.forEach(w => newWidgets[w] = true);
                    }
                    setWidgets(newWidgets);
                    
                    if (tmpl.widgetLayout) setWidgetLayout(tmpl.widgetLayout);
                    if (tmpl.stickers) setStickers(tmpl.stickers); else setStickers([]);
                    
                    if (tmpl.agendaItems) {
                        setAgendaItems(tmpl.agendaItems.map((item, idx) => ({
                            id: item.id || Date.now() + idx,
                            icon: item.icon || '📋',
                            text: item.text || '',
                            done: Boolean(item.done)
                        })));
                    }
                    
                    if (tmpl.notesText !== undefined) setNotesText(tmpl.notesText);
                    if (tmpl.workFormatIdx !== undefined) setWorkFormatIdx(tmpl.workFormatIdx);
                    if (tmpl.timerSeconds !== undefined) setTimerSeconds(tmpl.timerSeconds);
                    if (tmpl.timeTimerMinutes !== undefined) setTimeTimerMinutes(tmpl.timeTimerMinutes);
                    if (tmpl.bildstodData) setBildstodData(tmpl.bildstodData);
                    if (tmpl.youtubeUrl !== undefined) setYoutubeUrl(tmpl.youtubeUrl);
                    if (tmpl.namesList) setNamesList(tmpl.namesList);
                    
                    if (tmpl.createdGroupsJson) {
                        try { setCreatedGroups(JSON.parse(tmpl.createdGroupsJson)); } catch (e) { setCreatedGroups([]); }
                    } else { setCreatedGroups([]); }

                    if (tmpl.numGroups) setNumGroups(tmpl.numGroups);
                    if (tmpl.randomizerChosen !== undefined) setRandomizerChosen(tmpl.randomizerChosen);
                    if (tmpl.checkInQuestion) setCheckInQuestion(tmpl.checkInQuestion);
                    if (tmpl.checkInActive !== undefined) setCheckInActive(tmpl.checkInActive);
                    if (tmpl.exitTicketQuestion) setExitTicketQuestion(tmpl.exitTicketQuestion);
                    if (tmpl.exitTicketActive !== undefined) setExitTicketActive(tmpl.exitTicketActive);
                    
                    setSelectedWidgetKey(null);
                    setSelectedStickerId(null);
                    setShowCloudMenu(false);
                };

                const deleteTemplate = async (id) => {
                    if(confirm("Vill du ta bort denna mall?")) {
                        await window.firebaseApp.deleteDoc(window.firebaseApp.doc(window.firebaseApp.db, "templates", id));
                        if (currentLoadedTemplate && currentLoadedTemplate.id === id) {
                            setCurrentLoadedTemplate(null);
                        }
                    }
                };

                const addSticker = (emoji) => {
                    const newId = Date.now();
                    setStickers(prev => [...prev, { id: newId, emoji, x: window.innerWidth / 2 - 40, y: window.innerHeight / 2 - 40, size: 72 }]);
                    setSelectedStickerId(newId);
                    setSelectedWidgetKey(null);
                    setShowStickerMenu(false);
                };

                const updateStickerPos = (id, newPos) => {
                    setStickers(prev => prev.map(s => s.id === id ? { ...s, x: newPos.x, y: newPos.y } : s));
                };

                const updateStickerSize = (id, newSize) => {
                    setStickers(prev => prev.map(s => s.id === id ? { ...s, size: Math.max(36, Math.min(320, newSize)) } : s));
                };

                const resetBoard = () => {
                    setWidgets({ clock: false, timer: false, timetimer: false, bildstod: false, youtube: false, agenda: false, notes: false, dice: false, workformat: false, randomizer: false, group: false, checkin: false, exitticket: false });
                    setStickers([]);
                    setNotesText('');
                    setAgendaItems([{ id: 1, icon: '📖', text: 'Tyst läsning', done: false }]);
                    setCreatedGroups([]);
                    setRandomizerChosen(null);
                    setCheckInActive(false);
                    setExitTicketActive(false);
                    setSelectedWidgetKey(null);
                    setSelectedStickerId(null);
                    setCurrentLoadedTemplate(null);
                };

                const stickerCategories = {
                    "Bra jobbat & Fest": ['⭐','💯','🏆','🎉','🎈','👏','✨','🔥'],
                    "Skola & Ämnen": ['📚','💻','🖍️','🎒','✏️','📐','✂️','🍎','🔬','🎨','💡','🎵','⚽'],
                    "Höst & Halloween": ['🍁','🍄','🍂','🎃','👻','🕸️','🦇'],
                    "Jul & Vinter": ['🎄','🎅','🎁','❄️','⛄','🦌'],
                    "Påsk & Vår": ['🐰','🥚','🐣','🌷','🌱','🐝'],

            // Innehållskomponenter (Agenda med shrink-0 och min-w-0 för papperskorgen)
            const AgendaWidgetContent = ({ size, items, setItems, isSelected }) => {
                const iconList = ['📋', '📖', '✍️', '🗣️', '👥', '💻', '📐', '🎨', '🧪', '🎧', '🔔', '⭐', '🏃', '🥪', '❓'];
                const [newItem, setNewItem] = useState('');
                const [icon, setIcon] = useState('📋');
                const [draggedIdx, setDraggedIdx] = useState(null);

                const cycleIcon = (index) => {
                    setItems(items.map((it, i) => {
                        if (i !== index) return it;
                        const nextIdx = (iconList.indexOf(it.icon) + 1) % iconList.length;
                        return { ...it, icon: iconList[nextIdx] };
                    }));
                };

                const toggleDone = (index) => {
                    setItems(items.map((it, i) => i === index ? { ...it, done: !it.done } : it));
                };

                const moveItem = (from, to) => {
                    if (to < 0 || to >= items.length) return;
                    const next = [...items];
                    const [item] = next.splice(from, 1);
                    next.splice(to, 0, item);
                    setItems(next);
                };

                const widthFactor = (size?.w || 360) / 360;
                const heightFactor = (size?.h || 460) / 460;
                const scale = Math.max(0.85, Math.min(3.2, Math.max(widthFactor, heightFactor * 0.9)));

                const fontSize = Math.round(16 * scale);
                const iconSize = Math.round(24 * scale);
                const checkSize = Math.round(22 * scale);
                const itemPadding = Math.round(8 * scale);
                const itemGap = Math.round(10 * scale);
                const trashSize = Math.max(28, Math.round(32 * Math.min(1.5, scale)));

                return (
                    <div className="flex flex-col h-full relative">
                        <div className="flex-1 overflow-y-auto space-y-2 pb-16 custom-scrollbar pr-1">
                            {items.map((item, i) => (
                                <div 
                                    key={item.id || i} 
                                    draggable={isSelected}
                                    onDragStart={() => setDraggedIdx(i)}
                                    onDragOver={(e) => e.preventDefault()}
                                    onDrop={() => {
                                        if (draggedIdx !== null && draggedIdx !== i) {
                                            moveItem(draggedIdx, i);
                                            setDraggedIdx(null);
                                        }
                                    }}
                                    style={{ padding: `${itemPadding}px`, gap: `${itemGap}px` }}
                                    className={`flex items-center rounded-2xl border transition-all ${item.done ? 'bg-emerald-50/70 border-emerald-200' : 'bg-slate-50 border-slate-100 shadow-sm'}`}
                                >
                                    {/* Flytthandtag vid markering */}
                                    {isSelected && (
                                        <div className="flex items-center gap-0.5 text-slate-400 shrink-0">
                                            <span style={{ fontSize: `${Math.max(12, Math.round(14 * scale * 0.8))}px` }} className="cursor-grab active:cursor-grabbing px-0.5 select-none" title="Dra för att ändra ordning">☰</span>
                                            <div className="flex flex-col leading-none" style={{ fontSize: `${Math.max(9, Math.round(10 * scale * 0.8))}px` }}>
                                                <button onClick={() => moveItem(i, i - 1)} disabled={i === 0} className="hover:text-slate-700 disabled:opacity-20">▲</button>
                                                <button onClick={() => moveItem(i, i + 1)} disabled={i === items.length - 1} className="hover:text-slate-700 disabled:opacity-20">▼</button>
                                            </div>
                                        </div>
                                    )}

                                    {/* Checkbox */}
                                    <button 
                                        onClick={() => toggleDone(i)} 
                                        style={{ 
                                            width: `${checkSize}px`, 
                                            height: `${checkSize}px`, 
                                            minWidth: `${checkSize}px`,
                                            minHeight: `${checkSize}px`,
                                            fontSize: `${Math.round(checkSize * 0.65)}px` 
                                        }}
                                        className={`rounded-lg flex items-center justify-center border transition-all shrink-0 ${item.done ? 'bg-[#6F8166] border-[#6F8166] text-white font-bold' : 'border-slate-300 hover:border-slate-500 bg-white'}`}
                                        title={item.done ? "Markera som ej klar" : "Markera som klar"}
                                    >
                                        {item.done && '✓'}
                                    </button>

                                    {/* Symbol */}
                                    <button 
                                        onClick={() => cycleIcon(i)} 
                                        title="Klicka för att byta symbol" 
                                        style={{ fontSize: `${iconSize}px` }}
                                        className="hover:scale-110 transition-transform leading-none flex items-center justify-center shrink-0">
                                        {item.icon}
                                    </button>

                                    {/* Textfält med min-w-0 så det aldrig tränger undan papperskorgen */}
                                    {isSelected ? (
                                        <input 
                                            type="text" 
                                            value={item.text} 
                                            onChange={(e) => {
                                                const val = e.target.value;
                                                setItems(items.map((it, idx) => idx === i ? { ...it, text: val } : it));
                                            }}
                                            style={{ fontSize: `${fontSize}px` }}
                                            className={`flex-1 min-w-0 bg-white border border-slate-200 px-2 py-1 rounded-xl font-semibold outline-none focus:border-[#6F8166] ${item.done ? 'line-through text-slate-400' : 'text-slate-800'}`}
                                        />
                                    ) : (
                                        <span 
                                            onClick={() => toggleDone(i)} 
                                            style={{ fontSize: `${fontSize}px` }}
                                            className={`flex-1 min-w-0 font-semibold cursor-pointer leading-snug break-words ${item.done ? 'line-through text-slate-400' : 'text-slate-800'}`}>
                                            {item.text}
                                        </span>
                                    )}

                                    {/* Alltid synlig och lättillgänglig papperskorg */}
                                    {isSelected && (
                                        <button 
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                setItems(items.filter((_, idx) => idx !== i));
                                            }} 
                                            style={{ 
                                                width: `${trashSize}px`, 
                                                height: `${trashSize}px`, 
                                                minWidth: `${trashSize}px`, 
                                                minHeight: `${trashSize}px`,
                                                fontSize: `${Math.round(trashSize * 0.55)}px` 
                                            }}
                                            className="shrink-0 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition-all flex items-center justify-center"
                                            title="Ta bort aktivitet"
                                        >
                                            🗑️
                                        </button>
                                    )}
                                </div>
                            ))}
                        </div>

                        {isSelected && (
                            <div className="absolute bottom-0 left-0 right-0 flex gap-1.5 bg-white pt-2 border-t mt-1">
                                <select 
                                    value={icon} 
                                    onChange={e => setIcon(e.target.value)} 
                                    style={{ fontSize: `${Math.max(16, Math.round(18 * scale * 0.8))}px` }}
                                    className="bg-slate-100 p-1.5 rounded-xl border outline-none"
                                >
                                    {iconList.map(ic => <option key={ic} value={ic}>{ic}</option>)}
                                </select>
                                <input 
                                    value={newItem} 
                                    onChange={e => setNewItem(e.target.value)} 
                                    onKeyDown={e => {
                                        if (e.key === 'Enter' && newItem.trim()) {
                                            setItems([...items, { id: Date.now(), icon, text: newItem.trim(), done: false }]);
                                            setNewItem('');
                                        }
                                    }} 
                                    style={{ fontSize: `${Math.max(12, Math.round(14 * scale * 0.8))}px` }}
                                    className="flex-1 p-2 border rounded-xl outline-none focus:border-[#6F8166]" 
                                    placeholder="Ny aktivitet..." 
                                />
                            </div>
                        )}
                    </div>
                );
            };

            ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        }
    </script>
</body>
</html>
