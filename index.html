<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klassrumsskärm</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel för att tolka React (JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f4f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .bg-image { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; }
        .widget { position: absolute; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); display: flex; flex-direction: column; overflow: hidden; }
        .widget-header { background: #f8fafc; padding: 10px; cursor: grab; font-weight: bold; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .widget-header:active { cursor: grabbing; }
        .resize-handle { position: absolute; bottom: 0; right: 0; width: 20px; height: 20px; cursor: nwse-resize; display: flex; align-items: flex-end; justify-content: flex-end; padding: 4px; color: #94a3b8; }
        .dock { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; padding: 10px 20px; border-radius: 16px; display: flex; gap: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); z-index: 100; }
        .dock-btn { background: none; border: none; color: white; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; transition: transform 0.2s; }
        .dock-btn:hover { transform: translateY(-5px); color: #60a5fa; }
        .dock-icon { font-size: 24px; }
        .dock-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .post-it { background: #fef08a; padding: 15px; box-shadow: 2px 4px 10px rgba(0,0,0,0.1); font-family: 'Comic Sans MS', cursive, sans-serif; position: relative; }
        .sticker { position: absolute; cursor: grab; font-size: 64px; user-select: none; transition: transform 0.1s; }
        .sticker:active { cursor: grabbing; transform: scale(1.1); }
        
        /* Egen scrollbar för sticker-menyn */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase SDK (Standard ES Modules) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ==========================================
        // DIN FIREBASE-KOD
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCjnV83LrQ-I-5WMf-6EJ9xqV5xnufO6LQ",
            authDomain: "whiteboard-klassrum.firebaseapp.com",
            projectId: "whiteboard-klassrum",
            storageBucket: "whiteboard-klassrum.firebasestorage.app",
            messagingSenderId: "298760316508",
            appId: "1:298760316508:web:55608b567db408f14ae899"
        };
        // ==========================================

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Exponera för React
        window.firebaseApp = { auth, db, signInWithPopup, GoogleAuthProvider, signInAnonymously, onAuthStateChanged, collection, addDoc, onSnapshot, query, orderBy };
    </script>

    <!-- Huvudkoden för React -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Elevvyer (Syns bara i mobilen när de skannat QR) ---
        const urlParams = new URLSearchParams(window.location.search);
        const isStudent = urlParams.get('student');
        
        if (isStudent === 'checkin') {
            const StudentCheckIn = () => {
                const question = urlParams.get('q') || 'Hur mår du idag?';
                const boardId = urlParams.get('boardId');
                const [sent, setSent] = useState(false);

                useEffect(() => {
                    window.firebaseApp.signInAnonymously(window.firebaseApp.auth);
                }, []);

                const sendReaction = async (emoji) => {
                    if(!boardId) return;
                    await window.firebaseApp.addDoc(window.firebaseApp.collection(window.firebaseApp.db, 'checkins'), {
                        boardId, emoji, timestamp: new Date()
                    });
                    setSent(true);
                };

                if (sent) return <div className="p-10 text-center text-2xl font-bold mt-20">Tack för ditt svar! ✨</div>;

                return (
                    <div className="p-6 max-w-md mx-auto mt-10 text-center">
                        <h1 className="text-3xl font-bold mb-10">{question}</h1>
                        <div className="grid grid-cols-2 gap-6">
                            {['🤩', '🙂', '😐', '😔'].map(emoji => (
                                <button key={emoji} onClick={() => sendReaction(emoji)} className="text-7xl bg-gray-100 p-6 rounded-3xl shadow active:scale-95 transition-transform">{emoji}</button>
                            ))}
                        </div>
                    </div>
                );
            };
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<StudentCheckIn />);
        } 
        else if (isStudent === 'exitticket') {
            const StudentExitTicket = () => {
                const question = urlParams.get('q') || 'Din kommentar?';
                const boardId = urlParams.get('boardId');
                const [name, setName] = useState('');
                const [text, setText] = useState('');
                const [sent, setSent] = useState(false);

                useEffect(() => { window.firebaseApp.signInAnonymously(window.firebaseApp.auth); }, []);

                const sendTicket = async () => {
                    if(!boardId || !name || !text) return;
                    await window.firebaseApp.addDoc(window.firebaseApp.collection(window.firebaseApp.db, 'exittickets'), {
                        boardId, name, text, timestamp: new Date()
                    });
                    setSent(true);
                };

                if (sent) return <div className="p-10 text-center text-2xl font-bold mt-20">Skickat! Kolla på tavlan. 📌</div>;

                return (
                    <div className="p-6 max-w-md mx-auto mt-10 flex flex-col gap-4">
                        <h1 className="text-2xl font-bold text-center mb-6">{question}</h1>
                        <input type="text" placeholder="Ditt namn" className="p-4 border-2 border-gray-300 rounded-xl text-lg" value={name} onChange={e => setName(e.target.value)} />
                        <textarea placeholder="Ditt svar..." className="p-4 border-2 border-gray-300 rounded-xl text-lg h-32" value={text} onChange={e => setText(e.target.value)} />
                        <button onClick={sendTicket} className="bg-blue-600 text-white font-bold text-xl py-4 rounded-xl mt-4">Skicka in</button>
                    </div>
                );
            };
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<StudentExitTicket />);
        }
        else {
            // --- HUVUDPROGRAMMET FÖR TAVLAN (LÄRARVY) ---
            
            // Hjälpfunktion för att kunna dra runt rutor
            const useDraggable = (initialPos) => {
                const [pos, setPos] = useState(initialPos);
                const handleDrag = (e) => {
                    if (e.type === 'touchstart') {
                        const touch = e.touches[0];
                        let startX = touch.clientX - pos.x;
                        let startY = touch.clientY - pos.y;
                        const onTouchMove = (moveEvent) => setPos({ x: moveEvent.touches[0].clientX - startX, y: moveEvent.touches[0].clientY - startY });
                        const onTouchEnd = () => { document.removeEventListener('touchmove', onTouchMove); document.removeEventListener('touchend', onTouchEnd); };
                        document.addEventListener('touchmove', onTouchMove);
                        document.addEventListener('touchend', onTouchEnd);
                    } else {
                        let startX = e.clientX - pos.x;
                        let startY = e.clientY - pos.y;
                        const onMouseMove = (moveEvent) => setPos({ x: moveEvent.clientX - startX, y: moveEvent.clientY - startY });
                        const onMouseUp = () => { document.removeEventListener('mousemove', onMouseMove); document.removeEventListener('mouseup', onMouseUp); };
                        document.addEventListener('mousemove', onMouseMove);
                        document.addEventListener('mouseup', onMouseUp);
                    }
                };
                return [pos, handleDrag, setPos];
            };

            // Huvudappen
            const App = () => {
                const [bg, setBg] = useState('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1920&q=80');
                const [widgets, setWidgets] = useState({
                    agenda: false, notes: false, dice: false, workformat: false, group: false, checkin: false, exitticket: false
                });
                const [stickers, setStickers] = useState([]);
                const [showStickerMenu, setShowStickerMenu] = useState(false);
                const boardId = "board_" + Math.random().toString(36).substr(2, 9);
                const baseUrl = window.location.href.split('?')[0];

                const toggleWidget = (w) => setWidgets({...widgets, [w]: !widgets[w]});
                
                const addSticker = (emoji) => {
                    setStickers([...stickers, { id: Date.now(), emoji, x: window.innerWidth/2 - 40, y: window.innerHeight/2 - 40 }]);
                    setShowStickerMenu(false);
                };

                // Kategorier för klistermärken
                const stickerCategories = {
                    "Bra jobbat & Fest": ['⭐','💯','🏆','🎉','🎈','👏','✨','🔥'],
                    "Skola & Ämnen": ['📚','💻','🖍️','🎒','✏️','📐','✂️','🚌','🍎','🔬','🎨','💡','🎵','⚽'],
                    "Höst & Halloween": ['🍁','🍄','🍂','🎃','👻','🕸️','🦇','🦉'],
                    "Jul & Vinter": ['🎄','🎅','🎁','❄️','⛄','🦌','🕯️','🧣'],
                    "Påsk & Vår": ['🐰','🥚','🐣','🌷','🌱','🐝','🦋','🌈'],
                    "Sommar & Sol": ['☀️','🏖️','🍦','🍉','🌻','🐚','😎','🍓']
                };

                return (
                    <div>
                        {/* Bakgrund */}
                        <img src={bg} className="bg-image" alt="background" />
                        
                        {/* Toppmeny */}
                        <header className="absolute top-0 w-full p-4 flex justify-between bg-white/80 backdrop-blur shadow z-50">
                            <h1 className="text-xl font-bold text-gray-800">🏫 Klassrumsskärm</h1>
                            <div className="flex gap-4">
                                <button onClick={() => setBg(prompt('Klistra in länk till bild:', bg) || bg)} className="px-4 py-2 bg-gray-200 rounded-lg font-bold">🌄 Byt Bakgrund</button>
                                <button onClick={() => {setWidgets({}); setStickers([]);}} className="px-4 py-2 bg-red-100 text-red-600 rounded-lg font-bold">🗑️ Rensa tavlan</button>
                            </div>
                        </header>

                        {/* Fria Stickers på tavlan */}
                        {stickers.map(s => <Sticker key={s.id} sticker={s} />)}

                        {/* Widgets */}
                        {widgets.agenda && <AgendaWidget onClose={() => toggleWidget('agenda')} />}
                        {widgets.notes && <NotesWidget onClose={() => toggleWidget('notes')} />}
                        {widgets.dice && <DiceWidget onClose={() => toggleWidget('dice')} />}
                        {widgets.workformat && <WorkFormatWidget onClose={() => toggleWidget('workformat')} />}
                        {widgets.group && <GroupMakerWidget onClose={() => toggleWidget('group')} />}
                        {widgets.checkin && <CheckInWidget onClose={() => toggleWidget('checkin')} boardId={boardId} baseUrl={baseUrl} />}
                        {widgets.exitticket && <ExitTicketWidget onClose={() => toggleWidget('exitticket')} boardId={boardId} baseUrl={baseUrl} />}

                        {/* Klistermärkes-meny (Scrollbar och kategoriserad) */}
                        {showStickerMenu && (
                            <div className="absolute bottom-24 left-1/2 transform -translate-x-1/2 bg-white p-6 rounded-2xl shadow-2xl z-50 w-[450px] max-h-[60vh] flex flex-col border border-gray-200">
                                <div className="flex justify-between items-center mb-4 border-b pb-3">
                                    <h3 className="font-bold text-xl text-gray-800">Välj klistermärke</h3>
                                    <button onClick={() => setShowStickerMenu(false)} className="text-sm bg-gray-100 hover:bg-gray-200 px-3 py-2 rounded-lg font-bold">✕ Stäng</button>
                                </div>
                                <div className="flex-1 overflow-y-auto pr-2 custom-scrollbar">
                                    {Object.entries(stickerCategories).map(([category, emojis]) => (
                                        <div key={category} className="mb-6">
                                            <div className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">{category}</div>
                                            <div className="flex flex-wrap gap-3 text-4xl">
                                                {emojis.map(e => (
                                                    <button key={e} onClick={() => addSticker(e)} className="hover:scale-125 hover:-translate-y-1 transition-transform p-1">{e}</button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Docka i botten */}
                        <div className="dock">
                            <button className="dock-btn" onClick={() => toggleWidget('agenda')}><span className="dock-icon">📋</span><span className="dock-label">Agenda</span></button>
                            <button className="dock-btn" onClick={() => toggleWidget('notes')}><span className="dock-icon">📝</span><span className="dock-label">Anteckningar</span></button>
                            <button className="dock-btn" onClick={() => toggleWidget('dice')}><span className="dock-icon">🎲</span><span className="dock-label">Tärning</span></button>
                            <button className="dock-btn" onClick={() => toggleWidget('workformat')}><span className="dock-icon">🚦</span><span className="dock-label">Arbetsform</span></button>
                            <button className="dock-btn" onClick={() => toggleWidget('group')}><span className="dock-icon">👥</span><span className="dock-label">Grupper</span></button>
                            <button className="dock-btn" onClick={() => setShowStickerMenu(!showStickerMenu)}><span className="dock-icon">✨</span><span className="dock-label">Stickers</span></button>
                            <div className="w-px bg-gray-600 mx-2"></div>
                            <button className="dock-btn" onClick={() => toggleWidget('checkin')}><span className="dock-icon">😊</span><span className="dock-label">Incheckning</span></button>
                            <button className="dock-btn" onClick={() => toggleWidget('exitticket')}><span className="dock-icon">📌</span><span className="dock-label">Exit Ticket</span></button>
                        </div>
                    </div>
                );
            };

            // --- Komponenter för alla rutor ---

            const Sticker = ({ sticker }) => {
                const [pos, handleDrag] = useDraggable({ x: sticker.x, y: sticker.y });
                return <div className="sticker" style={{ left: pos.x, top: pos.y }} onMouseDown={handleDrag} onTouchStart={handleDrag}>{sticker.emoji}</div>;
            };

            const WidgetWrapper = ({ title, onClose, initialSize, children }) => {
                const [pos, handleDrag] = useDraggable({ x: 100 + Math.random()*50, y: 100 + Math.random()*50 });
                const [size, setSize] = useState(initialSize || { w: 300, h: 400 });
                
                const handleResize = (e) => {
                    const startX = e.clientX || e.touches[0].clientX;
                    const startY = e.clientY || e.touches[0].clientY;
                    const startW = size.w;
                    const startH = size.h;
                    
                    const onMove = (moveE) => {
                        const curX = moveE.clientX || moveE.touches[0].clientX;
                        const curY = moveE.clientY || moveE.touches[0].clientY;
                        setSize({ w: Math.max(200, startW + (curX - startX)), h: Math.max(150, startH + (curY - startY)) });
                    };
                    const onEnd = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onEnd); document.removeEventListener('touchmove', onMove); document.removeEventListener('touchend', onEnd); };
                    document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onEnd);
                    document.addEventListener('touchmove', onMove); document.addEventListener('touchend', onEnd);
                };

                return (
                    <div className="widget" style={{ left: pos.x, top: pos.y, width: size.w, height: size.h }}>
                        <div className="widget-header" onMouseDown={handleDrag} onTouchStart={handleDrag}>
                            <span>{title}</span>
                            <button onClick={onClose} className="text-gray-500 hover:text-red-500">✕</button>
                        </div>
                        <div className="flex-1 overflow-hidden relative bg-white p-4">
                            {children}
                        </div>
                        <div className="resize-handle" onMouseDown={handleResize} onTouchStart={handleResize}>⌟</div>
                    </div>
                );
            };

            const AgendaWidget = ({ onClose }) => {
                const [items, setItems] = useState([{ icon: '📖', text: 'Läsning' }]);
                const [newItem, setNewItem] = useState('');
                const [icon, setIcon] = useState('📋');
                const [presMode, setPresMode] = useState(false);

                return (
                    <WidgetWrapper title="📋 Agenda" onClose={onClose}>
                        <div className="flex justify-end mb-2">
                            <button onClick={() => setPresMode(!presMode)} className="text-xs bg-gray-100 px-2 py-1 rounded">👁️ {presMode ? 'Redigera' : 'Presentation'}</button>
                        </div>
                        <div className="flex flex-col h-full">
                            <div className="flex-1 overflow-y-auto space-y-2 pb-16">
                                {items.map((item, i) => (
                                    <div key={i} className="flex items-center gap-3 bg-blue-50 p-3 rounded-lg text-lg">
                                        <span className="text-2xl">{item.icon}</span>
                                        <span className="flex-1">{item.text}</span>
                                        {!presMode && <button onClick={() => setItems(items.filter((_, idx) => idx !== i))} className="text-red-400">🗑️</button>}
                                    </div>
                                ))}
                            </div>
                            {!presMode && (
                                <div className="absolute bottom-4 left-4 right-4 flex gap-2">
                                    <select value={icon} onChange={e => setIcon(e.target.value)} className="bg-gray-100 p-2 rounded-lg border">
                                        <option>📋</option><option>📖</option><option>✍️</option><option>🗣️</option><option>💻</option><option>🔔</option>
                                    </select>
                                    <input value={newItem} onChange={e => setNewItem(e.target.value)} onKeyDown={e => e.key === 'Enter' && (setItems([...items, { icon, text: newItem }]), setNewItem(''))} className="flex-1 p-2 border rounded-lg" placeholder="Ny punkt..." />
                                </div>
                            )}
                        </div>
                    </WidgetWrapper>
                );
            };

            const NotesWidget = ({ onClose }) => (
                <WidgetWrapper title="📝 Anteckningar" onClose={onClose} initialSize={{w: 400, h: 300}}>
                    <textarea className="w-full h-full resize-none outline-none text-xl" placeholder="Skriv något viktigt här..."></textarea>
                </WidgetWrapper>
            );

            const DiceWidget = ({ onClose }) => {
                const [val, setVal] = useState(1);
                return (
                    <WidgetWrapper title="🎲 Tärning" onClose={onClose} initialSize={{w: 200, h: 250}}>
                        <div className="flex flex-col items-center justify-center h-full gap-4">
                            <div className="text-8xl">{['⚀','⚁','⚂','⚃','⚄','⚅'][val-1]}</div>
                            <button onClick={() => setVal(Math.floor(Math.random() * 6) + 1)} className="bg-blue-600 text-white px-6 py-2 rounded-full font-bold">Kasta</button>
                        </div>
                    </WidgetWrapper>
                );
            };

            const WorkFormatWidget = ({ onClose }) => {
                const [mode, setMode] = useState(0);
                const modes = [{c: 'bg-red-500', t: 'Tyst arbete'}, {c: 'bg-yellow-400', t: 'Viskton'}, {c: 'bg-green-500', t: 'Samarbete'}];
                return (
                    <WidgetWrapper title="🚦 Arbetsform" onClose={onClose} initialSize={{w: 250, h: 300}}>
                        <div className="flex flex-col items-center justify-center h-full gap-6">
                            <div className={`w-24 h-24 rounded-full ${modes[mode].c} shadow-lg transition-colors`}></div>
                            <h2 className="text-2xl font-bold">{modes[mode].t}</h2>
                            <button onClick={() => setMode((mode + 1) % 3)} className="px-4 py-2 bg-gray-200 rounded-lg">Byt form</button>
                        </div>
                    </WidgetWrapper>
                );
            };

            const GroupMakerWidget = ({ onClose }) => {
                const [names, setNames] = useState("Anna, Björn, Cecilia, David, Elin, Filip, Greta");
                const [numGroups, setNumGroups] = useState(2);
                const [groups, setGroups] = useState([]);

                const generate = () => {
                    let list = names.split(',').map(n => n.trim()).filter(n => n);
                    list = list.sort(() => Math.random() - 0.5); // Shuffle
                    let result = Array.from({length: numGroups}, () => []);
                    list.forEach((name, i) => result[i % numGroups].push(name));
                    setGroups(result);
                };

                return (
                    <WidgetWrapper title="👥 Gruppskapare" onClose={onClose} initialSize={{w: 400, h: 450}}>
                        {groups.length === 0 ? (
                            <div className="flex flex-col h-full gap-2">
                                <label className="font-bold">Klasslista (separera med kommatecken)</label>
                                <textarea className="w-full h-24 border p-2 rounded" value={names} onChange={e => setNames(e.target.value)}></textarea>
                                <label className="font-bold mt-2">Antal grupper: {numGroups}</label>
                                <input type="range" min="2" max="10" value={numGroups} onChange={e => setNumGroups(e.target.value)} className="w-full" />
                                <button onClick={generate} className="mt-4 bg-purple-600 text-white font-bold py-3 rounded-lg">Slumpa Grupper</button>
                            </div>
                        ) : (
                            <div className="flex flex-col h-full">
                                <button onClick={() => setGroups([])} className="text-blue-600 underline mb-2 text-sm">Gör nya grupper</button>
                                <div className="flex-1 overflow-y-auto grid grid-cols-2 gap-4 pb-4 custom-scrollbar">
                                    {groups.map((g, i) => (
                                        <div key={i} className="bg-gray-100 p-3 rounded border">
                                            <div className="font-bold border-b pb-1 mb-2">Grupp {i+1}</div>
                                            <ul className="list-disc pl-4">{g.map(n => <li key={n}>{n}</li>)}</ul>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </WidgetWrapper>
                );
            };

            const CheckInWidget = ({ onClose, boardId, baseUrl }) => {
                const [q, setQ] = useState("Hur mår du idag?");
                const [active, setActive] = useState(false);
                const [counts, setCounts] = useState({'🤩':0, '🙂':0, '😐':0, '😔':0});

                useEffect(() => {
                    if (!active || !window.firebaseApp.db) return;
                    const qRef = window.firebaseApp.query(window.firebaseApp.collection(window.firebaseApp.db, "checkins"));
                    const unsubscribe = window.firebaseApp.onSnapshot(qRef, (snapshot) => {
                        let temp = {'🤩':0, '🙂':0, '😐':0, '😔':0};
                        snapshot.docs.forEach(doc => {
                            let d = doc.data();
                            if(d.boardId === boardId && temp[d.emoji] !== undefined) temp[d.emoji]++;
                        });
                        setCounts(temp);
                    });
                    return () => unsubscribe();
                }, [active]);

                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(baseUrl + '?student=checkin&boardId=' + boardId + '&q=' + q)}`;

                return (
                    <WidgetWrapper title="😊 Incheckning" onClose={onClose} initialSize={{w: 400, h: 450}}>
                        {!active ? (
                            <div className="flex flex-col h-full gap-4">
                                <label className="font-bold text-gray-700">Fråga till eleverna:</label>
                                <input value={q} onChange={e => setQ(e.target.value)} className="p-3 border rounded text-lg" />
                                <button onClick={() => setActive(true)} className="bg-green-600 text-white py-3 rounded-lg font-bold text-lg mt-auto">Starta Incheckning</button>
                            </div>
                        ) : (
                            <div className="flex flex-col items-center h-full gap-4">
                                <h3 className="font-bold text-lg text-center">{q}</h3>
                                <div className="flex gap-4 items-end h-32 border-b w-full px-4 pt-4">
                                    {Object.keys(counts).map(emoji => {
                                        let max = Math.max(...Object.values(counts), 1);
                                        let h = (counts[emoji] / max) * 100;
                                        return (
                                            <div key={emoji} className="flex-1 flex flex-col items-center gap-1">
                                                <div className="w-full bg-blue-400 rounded-t transition-all" style={{height: `${h}%`}}></div>
                                                <div className="text-2xl">{emoji}</div>
                                                <div className="text-xs font-bold">{counts[emoji]}</div>
                                            </div>
                                        )
                                    })}
                                </div>
                                <div className="mt-4 p-4 border-2 border-dashed rounded-xl flex flex-col items-center">
                                    <p className="text-xs text-gray-500 mb-2">Elever skannar för att svara</p>
                                    <img src={qrUrl} className="w-32 h-32" />
                                </div>
                            </div>
                        )}
                    </WidgetWrapper>
                );
            };

            const ExitTicketWidget = ({ onClose, boardId, baseUrl }) => {
                const [q, setQ] = useState("Vad tar du med dig från lektionen?");
                const [active, setActive] = useState(false);
                const [tickets, setTickets] = useState([]);

                useEffect(() => {
                    if (!active || !window.firebaseApp.db) return;
                    const qRef = window.firebaseApp.query(window.firebaseApp.collection(window.firebaseApp.db, "exittickets"));
                    const unsubscribe = window.firebaseApp.onSnapshot(qRef, (snapshot) => {
                        let temp = [];
                        snapshot.docs.forEach(doc => {
                            let d = doc.data();
                            if(d.boardId === boardId) temp.push(d);
                        });
                        setTickets(temp);
                    });
                    return () => unsubscribe();
                }, [active]);

                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(baseUrl + '?student=exitticket&boardId=' + boardId + '&q=' + q)}`;

                return (
                    <WidgetWrapper title="📌 Exit Ticket" onClose={onClose} initialSize={{w: 500, h: 500}}>
                        {!active ? (
                            <div className="flex flex-col h-full gap-4">
                                <label className="font-bold text-gray-700">Fråga (fritext):</label>
                                <textarea value={q} onChange={e => setQ(e.target.value)} className="p-3 border rounded text-lg h-24 resize-none"></textarea>
                                <button onClick={() => setActive(true)} className="bg-yellow-500 text-white py-3 rounded-lg font-bold text-lg mt-auto">Starta Exit Ticket</button>
                            </div>
                        ) : (
                            <div className="flex flex-col h-full">
                                <div className="flex justify-between items-start bg-gray-50 p-2 rounded mb-2 border">
                                    <div className="font-bold text-sm">{q}</div>
                                    <img src={qrUrl} className="w-16 h-16" />
                                </div>
                                <div className="flex-1 overflow-y-auto grid grid-cols-2 gap-4 p-2 bg-gray-200 rounded inner-shadow custom-scrollbar">
                                    {tickets.length === 0 && <div className="col-span-2 text-center text-gray-400 mt-10">Väntar på svar...</div>}
                                    {tickets.map((t, i) => (
                                        <div key={i} className="post-it">
                                            <div className="font-bold text-xs border-b border-yellow-400 pb-1 mb-1">{t.name}</div>
                                            <div className="text-sm">{t.text}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </WidgetWrapper>
                );
            };

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        }
    </script>
</body>
</html>
