<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klassrumsskärm</title>
    
    <!-- Google Fonts: Outfit (Täby Parkskolans officiella profilteckensnitt) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel för JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #f8fafc; 
            font-family: 'Outfit', sans-serif; 
            user-select: none;
        }
        .bg-image { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            object-fit: cover; 
            z-index: 0; 
        }
        .widget { 
            position: absolute; 
            background: white; 
            border-radius: 20px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            transition: box-shadow 0.2s, border-color 0.2s;
        }
        .widget-clean {
            box-shadow: 0 8px 24px -4px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .widget-selected {
            box-shadow: 0 16px 36px -6px rgba(111, 129, 102, 0.25);
            border: 2px solid #6F8166;
        }
        .widget-header { 
            background: #f8fafc; 
            padding: 8px 14px; 
            cursor: grab; 
            font-weight: 700; 
            border-bottom: 1px solid #e2e8f0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            touch-action: none; 
            font-size: 13px;
            color: #334155;
        }
        .widget-header:active { cursor: grabbing; }
        .resize-handle { 
            position: absolute; 
            bottom: 0; 
            right: 0; 
            width: 22px; 
            height: 22px; 
            cursor: nwse-resize; 
            display: flex; 
            align-items: flex-end; 
            justify-content: flex-end; 
            padding: 3px; 
            color: #6F8166; 
            touch-action: none; 
        }
        .dock { 
            position: absolute; 
            bottom: 16px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: #1e293b; 
            padding: 8px 18px; 
            border-radius: 24px; 
            display: flex; 
            gap: 12px; 
            box-shadow: 0 16px 32px rgba(0,0,0,0.3); 
            z-index: 50; 
            max-width: 96vw; 
            overflow-x: auto; 
        }
        .dock-btn { 
            background: none; 
            border: none; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 3px; 
            cursor: pointer; 
            transition: transform 0.15s, color 0.15s; 
            white-space: nowrap; 
        }
        .dock-btn:hover { transform: translateY(-3px); color: #9CAE91; }
        .dock-icon { font-size: 20px; line-height: 1; }
        .dock-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600; opacity: 0.9; }
        
        .sticker { 
            position: absolute; 
            user-select: none; 
            display: inline-block; 
            touch-action: none; 
            z-index: 40 !important; /* Alltid överst */
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCjnV83LrQ-I-5WMf-6EJ9xqV5xnufO6LQ",
            authDomain: "whiteboard-klassrum.firebaseapp.com",
            projectId: "whiteboard-klassrum",
            storageBucket: "whiteboard-klassrum.firebasestorage.app",
            messagingSenderId: "298760316508",
            appId: "1:298760316508:web:55608b567db408f14ae899"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseApp = { auth, db, signInWithPopup, GoogleAuthProvider, signInAnonymously, onAuthStateChanged, signOut, collection, addDoc, onSnapshot, query, where, deleteDoc, doc };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Elevvyer ---
        const urlParams = new URLSearchParams(window.location.search);
        const isStudent = urlParams.get('student');
        
        if (isStudent === 'checkin') {
            const StudentCheckIn = () => {
                const question = urlParams.get('q') || 'Hur mår du idag?';
                const boardId = urlParams.get('boardId');
                const [sent, setSent] = useState(false);
                useEffect(() => { window.firebaseApp.signInAnonymously(window.firebaseApp.auth); }, []);
                const sendReaction = async (emoji) => {
                    if(!boardId) return;
                    await window.firebaseApp.addDoc(window.firebaseApp.collection(window.firebaseApp.db, 'checkins'), { boardId, emoji, timestamp: new Date() });
                    setSent(true);
                };
                if (sent) return <div className="p-10 text-center text-2xl font-bold mt-20 text-emerald-800">Tack för ditt svar! ✨</div>;
                return (
                    <div className="p-6 max-w-md mx-auto mt-10 text-center">
                        <h1 className="text-3xl font-bold mb-10 text-slate-800">{question}</h1>
                        <div className="grid grid-cols-2 gap-6">
                            {['🤩', '🙂', '😐', '😔'].map(emoji => (
                                <button key={emoji} onClick={() => sendReaction(emoji)} className="text-7xl bg-white p-6 rounded-3xl shadow-md border active:scale-95 transition-transform">{emoji}</button>
                            ))}
                        </div>
                    </div>
                );
            };
            ReactDOM.createRoot(document.getElementById('root')).render(<StudentCheckIn />);
        } 
        else if (isStudent === 'exitticket') {
            const StudentExitTicket = () => {
                const question = urlParams.get('q') || 'Din kommentar?';
                const boardId = urlParams.get('boardId');
                const [name, setName] = useState('');
                const [text, setText] = useState('');
                const [sent, setSent] = useState(false);
                useEffect(() => { window.firebaseApp.signInAnonymously(window.firebaseApp.auth); }, []);
                const sendTicket = async () => {
                    if(!boardId || !name || !text) return;
                    await window.firebaseApp.addDoc(window.firebaseApp.collection(window.firebaseApp.db, 'exittickets'), { boardId, name, text, timestamp: new Date() });
                    setSent(true);
                };
                if (sent) return <div className="p-10 text-center text-2xl font-bold mt-20 text-emerald-800">Skickat! Kolla på tavlan. 📌</div>;
                return (
                    <div className="p-6 max-w-md mx-auto mt-10 flex flex-col gap-4">
                        <h1 className="text-2xl font-bold text-center mb-6 text-slate-800">{question}</h1>
                        <input type="text" placeholder="Ditt namn" className="p-4 border-2 border-slate-200 rounded-xl text-lg outline-none focus:border-emerald-600" value={name} onChange={e => setName(e.target.value)} />
                        <textarea placeholder="Ditt svar..." className="p-4 border-2 border-slate-200 rounded-xl text-lg h-32 outline-none focus:border-emerald-600" value={text} onChange={e => setText(e.target.value)} />
                        <button onClick={sendTicket} className="bg-[#6F8166] text-white font-bold text-xl py-4 rounded-xl mt-4 shadow-md">Skicka in</button>
                    </div>
                );
            };
            ReactDOM.createRoot(document.getElementById('root')).render(<StudentExitTicket />);
        }
        else {
            // --- Drag-hook ---
            const useDraggable = (initialPos, onDragEnd) => {
                const [pos, setPos] = useState(initialPos);
                const posRef = useRef(pos);
                posRef.current = pos;

                useEffect(() => {
                    if (initialPos) setPos(initialPos);
                }, [initialPos?.x, initialPos?.y]);

                const handleDrag = (e) => {
                    if (e.target.tagName === 'BUTTON' || e.target.closest('button') || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'IFRAME') return;
                    
                    if (e.type === 'touchstart') {
                        const touch = e.touches[0];
                        let startX = touch.clientX - posRef.current.x;
                        let startY = touch.clientY - posRef.current.y;
                        let currentPos = { ...posRef.current };

                        const onTouchMove = (mE) => {
                            if (mE.cancelable) mE.preventDefault();
                            currentPos = {
                                x: Math.max(0, mE.touches[0].clientX - startX),
                                y: Math.max(0, mE.touches[0].clientY - startY)
                            };
                            setPos(currentPos);
                        };

                        const onTouchEnd = () => {
                            document.removeEventListener('touchmove', onTouchMove);
                            document.removeEventListener('touchend', onTouchEnd);
                            if (onDragEnd) onDragEnd(currentPos);
                        };

                        document.addEventListener('touchmove', onTouchMove, { passive: false });
                        document.addEventListener('touchend', onTouchEnd);
                    } else {
                        let startX = e.clientX - posRef.current.x;
                        let startY = e.clientY - posRef.current.y;
                        let currentPos = { ...posRef.current };

                        const onMouseMove = (mE) => {
                            currentPos = {
                                x: Math.max(0, mE.clientX - startX),
                                y: Math.max(0, mE.clientY - startY)
                            };
                            setPos(currentPos);
                        };

                        const onMouseUp = () => {
                            document.removeEventListener('mousemove', onMouseMove);
                            document.removeEventListener('mouseup', onMouseUp);
                            if (onDragEnd) onDragEnd(currentPos);
                        };

                        document.addEventListener('mousemove', onMouseMove);
                        document.addEventListener('mouseup', onMouseUp);
                    }
                };
                return [pos, handleDrag, setPos];
            };

            const defaultLayout = {
                clock: { x: 50, y: 80, w: 260, h: 180 },
                timer: { x: 330, y: 80, w: 280, h: 200 },
                timetimer: { x: 50, y: 280, w: 290, h: 360 },
                bildstod: { x: 360, y: 300, w: 320, h: 340 },
                youtube: { x: 700, y: 80, w: 460, h: 330 },
                agenda: { x: 50, y: 280, w: 320, h: 420 },
                notes: { x: 700, y: 430, w: 380, h: 260 },
                dice: { x: 400, y: 460, w: 280, h: 320 },
                workformat: { x: 700, y: 400, w: 330, h: 360 },
                randomizer: { x: 1050, y: 80, w: 320, h: 320 },
                group: { x: 1050, y: 420, w: 400, h: 440 },
                checkin: { x: 400, y: 150, w: 380, h: 440 },
                exitticket: { x: 450, y: 150, w: 500, h: 480 }
            };

            const App = () => {
                const [bg, setBg] = useState('#FFFFFF');
                const [widgets, setWidgets] = useState({ 
                    clock: false, 
                    timer: false, 
                    timetimer: false, 
                    bildstod: false, 
                    youtube: false, 
                    agenda: false, 
                    notes: false, 
                    dice: false, 
                    workformat: false, 
                    randomizer: false, 
                    group: false, 
                    checkin: false, 
                    exitticket: false 
                });
                const [widgetLayout, setWidgetLayout] = useState(defaultLayout);
                
                // Aktivt vald widget (övriga visas i rent presentationsläge)
                const [selectedWidgetKey, setSelectedWidgetKey] = useState(null);

                // Innehåll och data
                const [stickers, setStickers] = useState([]);
                const [agendaItems, setAgendaItems] = useState([{ icon: '📖', text: 'Tyst läsning' }]);
                const [notesText, setNotesText] = useState('');
                const [workFormatIdx, setWorkFormatIdx] = useState(0);
                const [timerSeconds, setTimerSeconds] = useState(5 * 60);
                const [timeTimerMinutes, setTimeTimerMinutes] = useState(15);
                const [bildstodData, setBildstodData] = useState({ tag: 'NU', icon: '👂', label: 'Lyssna' });
                const [youtubeUrl, setYoutubeUrl] = useState('');
                const [namesList, setNamesList] = useState("Anna, Björn, Cecilia, David, Elin, Filip, Greta, Hugo, Ida, Johan");
                const [createdGroups, setCreatedGroups] = useState([]);
                const [numGroups, setNumGroups] = useState(2);
                const [randomizerChosen, setRandomizerChosen] = useState(null);
                const [checkInQuestion, setCheckInQuestion] = useState("Hur mår du idag?");
                const [checkInActive, setCheckInActive] = useState(false);
                const [exitTicketQuestion, setExitTicketQuestion] = useState("Vad tar du med dig från lektionen?");
                const [exitTicketActive, setExitTicketActive] = useState(false);

                // Menyer
                const [showStickerMenu, setShowStickerMenu] = useState(false);
                const [showBgMenu, setShowBgMenu] = useState(false);
                const [showCloudMenu, setShowCloudMenu] = useState(false);
                
                const [user, setUser] = useState(null);
                const [templates, setTemplates] = useState([]);
                
                const boardIdRef = useRef("board_" + Math.random().toString(36).substr(2, 9));
                const baseUrl = window.location.href.split('?')[0];

                const toggleWidget = (w) => {
                    setWidgets(prev => {
                        const next = !prev[w];
                        if (next) setSelectedWidgetKey(w);
                        return { ...prev, [w]: next };
                    });
                };

                const updateLayout = (wKey, updateData) => {
                    setWidgetLayout(prev => ({
                        ...prev,
                        [wKey]: { ...prev[wKey], ...updateData }
                    }));
                };
                
                useEffect(() => {
                    const unsubscribe = window.firebaseApp.onAuthStateChanged(window.firebaseApp.auth, currentUser => {
                        if (currentUser && !currentUser.isAnonymous) {
                            setUser(currentUser);
                            const q = window.firebaseApp.query(window.firebaseApp.collection(window.firebaseApp.db, "templates"), window.firebaseApp.where("userId", "==", currentUser.uid));
                            window.firebaseApp.onSnapshot(q, snap => {
                                let tmp = [];
                                snap.docs.forEach(doc => tmp.push({id: doc.id, ...doc.data()}));
                                setTemplates(tmp);
                            });
                        } else {
                            setUser(null);
                            setTemplates([]);
                        }
                    });
                    return () => unsubscribe();
                }, []);

                const handleLogin = () => {
                    window.firebaseApp.signInWithPopup(window.firebaseApp.auth, new window.firebaseApp.GoogleAuthProvider())
                    .catch(() => alert("Inloggning misslyckades."));
                };

                const handleLogout = () => { window.firebaseApp.signOut(window.firebaseApp.auth); };

                const handleImageUpload = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 1280;
                            const scale = Math.min(1, MAX_WIDTH / img.width);
                            canvas.width = img.width * scale;
                            canvas.height = img.height * scale;

                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.55);
                            setBg(compressedBase64);
                            setShowBgMenu(false);
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                };

                // Sparar allt inklusive nya widgets
                const saveTemplate = async () => {
                    if (!user) {
                        alert("Logga in med Google först för att spara mallar!");
                        return;
                    }
                    const name = prompt("Namnge denna tavla (t.ex. 'Svenska Åk 7'):");
                    if (!name) return;
                    const activeWidgets = Object.keys(widgets).filter(k => widgets[k]);
                    
                    try {
                        await window.firebaseApp.addDoc(window.firebaseApp.collection(window.firebaseApp.db, "templates"), {
                            userId: user.uid,
                            name: name,
                            bg: bg || '#FFFFFF',
                            activeWidgets: activeWidgets,
                            widgetLayout: widgetLayout,
                            stickers: stickers,
                            agendaItems: agendaItems,
                            notesText: notesText || '',
                            workFormatIdx: Number(workFormatIdx) || 0,
                            timerSeconds: Number(timerSeconds) || 300,
                            timeTimerMinutes: Number(timeTimerMinutes) || 15,
                            bildstodData: bildstodData,
                            youtubeUrl: youtubeUrl || '',
                            namesList: namesList || '',
                            createdGroupsJson: JSON.stringify(createdGroups || []),
                            numGroups: Number(numGroups) || 2,
                            randomizerChosen: randomizerChosen || null,
                            checkInQuestion: checkInQuestion || '',
                            checkInActive: Boolean(checkInActive),
                            exitTicketQuestion: exitTicketQuestion || '',
                            exitTicketActive: Boolean(exitTicketActive),
                            timestamp: new Date()
                        });
                        alert("Mallen har sparats i molnet! ☁️");
                    } catch (err) {
                        alert("Kunde inte spara till molnet: " + err.message);
                    }
                };

                // Återställning av mall
                const loadTemplate = (tmpl) => {
                    if (tmpl.bg) setBg(tmpl.bg);
                    
                    let newWidgets = { clock: false, timer: false, timetimer: false, bildstod: false, youtube: false, agenda: false, notes: false, dice: false, workformat: false, randomizer: false, group: false, checkin: false, exitticket: false };
                    if(tmpl.activeWidgets) {
                        tmpl.activeWidgets.forEach(w => newWidgets[w] = true);
                    }
                    setWidgets(newWidgets);
                    
                    if (tmpl.widgetLayout) setWidgetLayout(tmpl.widgetLayout);
                    if (tmpl.stickers) setStickers(tmpl.stickers); else setStickers([]);
                    if (tmpl.agendaItems) setAgendaItems(tmpl.agendaItems);
                    if (tmpl.notesText !== undefined) setNotesText(tmpl.notesText);
                    if (tmpl.workFormatIdx !== undefined) setWorkFormatIdx(tmpl.workFormatIdx);
                    if (tmpl.timerSeconds !== undefined) setTimerSeconds(tmpl.timerSeconds);
                    if (tmpl.timeTimerMinutes !== undefined) setTimeTimerMinutes(tmpl.timeTimerMinutes);
                    if (tmpl.bildstodData) setBildstodData(tmpl.bildstodData);
                    if (tmpl.youtubeUrl !== undefined) setYoutubeUrl(tmpl.youtubeUrl);
                    if (tmpl.namesList) setNamesList(tmpl.namesList);
                    
                    if (tmpl.createdGroupsJson) {
                        try { setCreatedGroups(JSON.parse(tmpl.createdGroupsJson)); } catch (e) { setCreatedGroups([]); }
                    } else { setCreatedGroups([]); }

                    if (tmpl.numGroups) setNumGroups(tmpl.numGroups);
                    if (tmpl.randomizerChosen !== undefined) setRandomizerChosen(tmpl.randomizerChosen);
                    if (tmpl.checkInQuestion) setCheckInQuestion(tmpl.checkInQuestion);
                    if (tmpl.checkInActive !== undefined) setCheckInActive(tmpl.checkInActive);
                    if (tmpl.exitTicketQuestion) setExitTicketQuestion(tmpl.exitTicketQuestion);
                    if (tmpl.exitTicketActive !== undefined) setExitTicketActive(tmpl.exitTicketActive);
                    
                    setSelectedWidgetKey(null);
                    setShowCloudMenu(false);
                };

                const deleteTemplate = async (id) => {
                    if(confirm("Vill du ta bort denna mall?")) {
                        await window.firebaseApp.deleteDoc(window.firebaseApp.doc(window.firebaseApp.db, "templates", id));
                    }
                };

                const addSticker = (emoji) => {
                    setStickers(prev => [...prev, { id: Date.now(), emoji, x: window.innerWidth / 2 - 40, y: window.innerHeight / 2 - 40 }]);
                    setShowStickerMenu(false);
                };

                const updateStickerPos = (id, newPos) => {
                    setStickers(prev => prev.map(s => s.id === id ? { ...s, x: newPos.x, y: newPos.y } : s));
                };

                const resetBoard = () => {
                    setWidgets({ clock: false, timer: false, timetimer: false, bildstod: false, youtube: false, agenda: false, notes: false, dice: false, workformat: false, randomizer: false, group: false, checkin: false, exitticket: false });
                    setStickers([]);
                    setNotesText('');
                    setAgendaItems([{ icon: '📖', text: 'Tyst läsning' }]);
                    setCreatedGroups([]);
                    setRandomizerChosen(null);
                    setCheckInActive(false);
                    setExitTicketActive(false);
                    setSelectedWidgetKey(null);
                };

                const stickerCategories = {
                    "Bra jobbat & Fest": ['⭐','💯','🏆','🎉','🎈','👏','✨','🔥'],
                    "Skola & Ämnen": ['📚','💻','🖍️','🎒','✏️','📐','✂️','🍎','🔬','🎨','💡','🎵','⚽'],
                    "Höst & Halloween": ['🍁','🍄','🍂','🎃','👻','🕸️','🦇'],
                    "Jul & Vinter": ['🎄','🎅','🎁','❄️','⛄','🦌'],
                    "Påsk & Vår": ['🐰','🥚','🐣','🌷','🌱','🐝'],
                    "Sommar & Sol": ['☀️','🏖️','🍦','🍉','🌻','😎']
                };

                // Profilfärger från Täby Parkskolans grafiska profil
                const schoolColors = [
                    { name: 'Vit', hex: '#FFFFFF', dark: false },
                    { name: 'Grön', hex: '#6F8166', dark: true },
                    { name: 'Ljusgrön', hex: '#E4F0DF', dark: false },
                    { name: 'Ljusbeige', hex: '#FFF3E3', dark: false },
                    { name: 'Mörkröd', hex: '#A14840', dark: true },
                    { name: 'Gulbrun', hex: '#CAA663', dark: true }
                ];

                const bgOptions = [
                    "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80",
                    "https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1920&q=80",
                    "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80",
                    "https://images.unsplash.com/photo-1483921020237-2ff51e8e4b22?auto=format&fit=crop&w=1920&q=80",
                    "https://images.unsplash.com/photo-1507783548227-544c3b8fc065?auto=format&fit=crop&w=1920&q=80",
                    "https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=1920&q=80"
                ];

                return (
                    <div 
                        className="w-screen h-screen overflow-hidden relative select-none"
                        onClick={(e) => {
                            // Klick på bakgrunden avmarkerar och aktiverar presentationsläge
                            if (e.target === e.currentTarget || e.target.classList.contains('bg-image')) {
                                setSelectedWidgetKey(null);
                            }
                        }}
                    >
                        {/* Bakgrund */}
                        {bg && bg.startsWith('#') ? (
                            <div className="bg-image" style={{ backgroundColor: bg }} />
                        ) : (
                            <img src={bg} className="bg-image" alt="background" />
                        )}
                        
                        {/* Toppmeny */}
                        <header className="absolute top-0 w-full p-4 flex justify-between items-center bg-white/80 backdrop-blur-md shadow-sm z-30">
                            <h1 className="text-xl font-bold text-slate-800 flex items-center gap-2">

                        {/* Sticker Meny */}
                        {showStickerMenu && (

                                    <button onClick={() => setShowStickerMenu(false)} className="text-xs bg-slate-100 hover:bg-slate-200 px-2.5 py-1.5 rounded-lg font-bold">✕ Stäng</button>

                            <button className="dock-btn" onClick={() => toggleWidget('agenda')}><span className="dock-icon">📋</span><span className="dock-label">Agenda</span></button>

                            <button className="dock-btn" onClick={() => toggleWidget('dice')}><span className="dock-icon">🎲</span><span className="dock-label">Tärning</span></button>
                            <button className="dock-btn" onClick={() => toggleWidget('workformat')}><span className="dock-icon">🤫</span><span className="dock-label">Arbetssätt</span></button>
                            <button className="dock-btn" onClick={() => toggleWidget('randomizer')}><span className="dock-icon">🎯</span><span className="dock-label">Slumpa</span></button>
                            <button className="dock-btn" onClick={() => toggleWidget('group')}><span className="dock-icon">👥</span><span className="dock-label">Grupper</span></button>
                            <div className="w-px bg-slate-700 mx-0.5"></div>
                            <button className="dock-btn" onClick={() => setShowStickerMenu(!showStickerMenu)}><span className="dock-icon">✨</span><span className="dock-label">Stickers</span></button>
                            <button className="dock-btn" onClick={() => toggleWidget('checkin')}><span className="dock-icon">😊</span><span className="dock-label">Incheck</span></button>
                            <button className="dock-btn" onClick={() => toggleWidget('exitticket')}><span className="dock-icon">📌</span><span className="dock-label">Exit Ticket</span></button>
                        </div>

            // Diskret sticker
            const Sticker = ({ sticker, onRemove, onUpdatePos }) => {
                const [pos, handleDrag] = useDraggable(
                    { x: sticker.x, y: sticker.y },
                    (newPos) => onUpdatePos && onUpdatePos(sticker.id, newPos)
                );

                return (
                    <div className="sticker group" style={{ left: pos.x, top: pos.y }}>
                        <div 
                            onMouseDown={handleDrag} 
                            onTouchStart={handleDrag} 
                            className="cursor-grab active:cursor-grabbing select-none drop-shadow-md text-[64px] leading-none">
                            {sticker.emoji}
                        </div>
                        <button 
                            onClick={(e) => { e.stopPropagation(); onRemove(sticker.id); }} 
                            title="Ta bort"
                            className="absolute -top-1 -right-1 bg-white/60 hover:bg-rose-500 hover:text-white text-slate-400 rounded-full w-5 h-5 flex items-center justify-center text-[10px] font-bold shadow-sm border border-slate-200 transition-all opacity-40 hover:opacity-100 z-50">
                            ✕
                        </button>
                    </div>
                );
            };

            // Smart Fönsterram: Visar ram och reglage när vald, rent presentationsläge när man klickar bredvid
            const WidgetWrapper = ({ title, widgetKey, isSelected, onSelect, onClose, layout, onUpdateLayout, children }) => {
                const [size, setSize] = useState({ w: layout?.w || 320, h: layout?.h || 320 });

                useEffect(() => {
                    if (layout?.w && layout?.h) {
                        setSize({ w: layout.w, h: layout.h });
                    }
                }, [layout?.w, layout?.h]);

                const [pos, handleDrag] = useDraggable(
                    { x: layout?.x || 100, y: layout?.y || 100 },
                    (newPos) => onUpdateLayout && onUpdateLayout({ x: newPos.x, y: newPos.y })
                );

                const handleResize = (e) => {
                    e.stopPropagation();
                    const startX = e.clientX || (e.touches && e.touches[0].clientX);
                    const startY = e.clientY || (e.touches && e.touches[0].clientY);
                    const startW = size.w;
                    const startH = size.h;
                    let newSize = { w: startW, h: startH };

                    const onMove = (moveE) => {
                        if (moveE.cancelable) moveE.preventDefault();
                        const curX = moveE.clientX || (moveE.touches && moveE.touches[0].clientX);
                        const curY = moveE.clientY || (moveE.touches && moveE.touches[0].clientY);
                        newSize = {
                            w: Math.max(200, startW + (curX - startX)),
                            h: Math.max(140, startH + (curY - startY))
                        };
                        setSize(newSize);
                    };

                    const onEnd = () => {
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onEnd);
                        document.removeEventListener('touchmove', onMove);
                        document.removeEventListener('touchend', onEnd);
                        if (onUpdateLayout) onUpdateLayout({ w: newSize.w, h: newSize.h });
                    };

                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onEnd);
                    document.addEventListener('touchmove', onMove, { passive: false });
                    document.addEventListener('touchend', onEnd);
                };

                return (
                    <div 
                        className={`widget ${isSelected ? 'widget-selected z-20' : 'widget-clean z-10'}`} 
                        style={{ left: pos.x, top: pos.y, width: size.w, height: size.h }}
                        onClick={(e) => {
                            e.stopPropagation();
                            if (!isSelected) onSelect();
                        }}
                    >
                        {/* Rubrik & Flytthandtag visas endast när widgeten är markerad */}
                        {isSelected && (
                            <div className="widget-header" onMouseDown={handleDrag} onTouchStart={handleDrag}>
                                <div className="flex items-center gap-2">
                                    <span className="w-2 h-2 rounded-full bg-[#6F8166]"></span>
                                    <span>{title}</span>
                                    <span className="text-[10px] text-slate-400 font-normal">Dra för att flytta</span>
                                </div>
                                <button onClick={(e) => { e.stopPropagation(); onClose(); }} className="text-slate-400 hover:text-rose-500 font-bold text-sm px-1">✕</button>
                            </div>
                        )}

                        <div className="flex-1 overflow-hidden relative bg-white p-3.5 flex flex-col">
                            {children}
                        </div>

                        {/* Storlekshandtag visas endast när widgeten är markerad */}
                        {isSelected && (
                            <div className="resize-handle" onMouseDown={handleResize} onTouchStart={handleResize}>⌟</div>
                        )}
                    </div>
                );
            };

            // 1. Klocka
            const ClockWidgetContent = () => {
                const [time, setTime] = useState(new Date());
                useEffect(() => {
                    const timer = setInterval(() => setTime(new Date()), 1000);
                    return () => clearInterval(timer);
                }, []);
                return (
                    <div className="flex flex-col items-center justify-center h-full">
                        <div className="text-[64px] leading-none font-extrabold tabular-nums tracking-tight text-slate-800">
                            {time.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' })}
                        </div>
                        <div className="text-sm text-slate-500 font-semibold mt-2 uppercase tracking-widest">
                            {time.toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'long' })}
                        </div>
                    </div>
                );
            };

            // 2. Digital Timer (Klassvy-stil)
            const DigitalTimerContent = ({ seconds, setSeconds }) => {
                const [timeLeft, setTimeLeft] = useState(seconds || 300);
                const [isRunning, setIsRunning] = useState(false);

                useEffect(() => {
                    setTimeLeft(seconds);
                    setIsRunning(false);
                }, [seconds]);

                useEffect(() => {
                    let int;
                    if (isRunning && timeLeft > 0) {
                        int = setInterval(() => setTimeLeft(t => t - 1), 1000);
                    } else if (timeLeft === 0) {
                        setIsRunning(false);
                    }
                    return () => clearInterval(int);
                }, [isRunning, timeLeft]);

                const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                const s = (timeLeft % 60).toString().padStart(2, '0');

                const addMins = (mins) => {
                    const next = Math.max(0, (seconds || 300) + mins * 60);
                    setSeconds(next);
                    setTimeLeft(next);
                    setIsRunning(false);
                };

                return (
                    <div className="flex flex-col items-center justify-between h-full py-1">
                        <div className={`text-[68px] font-extrabold tabular-nums tracking-tight my-auto ${timeLeft === 0 ? 'text-rose-500 animate-pulse' : 'text-slate-800'}`}>
                            {m}:{s}
                        </div>
                        <div className="flex gap-2 w-full mb-2">
                            <button onClick={() => addMins(-1)} className="flex-1 bg-slate-100 hover:bg-slate-200 py-1.5 rounded-xl font-bold text-xs text-slate-600">- 1 min</button>
                            <button onClick={() => addMins(1)} className="flex-1 bg-slate-100 hover:bg-slate-200 py-1.5 rounded-xl font-bold text-xs text-slate-600">+ 1 min</button>
                            <button onClick={() => addMins(5)} className="flex-1 bg-slate-100 hover:bg-slate-200 py-1.5 rounded-xl font-bold text-xs text-slate-600">+ 5 min</button>
                        </div>
                        <div className="flex gap-2 w-full">
                            <button onClick={() => setIsRunning(!isRunning)} className={`flex-1 py-2.5 rounded-xl font-bold text-sm text-white shadow-sm transition-all ${isRunning ? 'bg-amber-600 hover:bg-amber-700' : 'bg-[#6F8166] hover:bg-[#5b6b54]'}`}>
                                {isRunning ? 'Paus' : 'Starta'}
                            </button>
                            <button onClick={() => { setIsRunning(false); setTimeLeft(seconds); }} className="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold text-xs text-slate-600">
                                Återställ
                            </button>
                        </div>
                    </div>
                );
            };

            // 3. Time Timer (Analog Urtavla med röd skiva)
            const TimeTimerContent = ({ initialMins, setInitialMins }) => {
                const [totalSeconds, setTotalSeconds] = useState((initialMins || 15) * 60);
                const [timeLeft, setTimeLeft] = useState(totalSeconds);
                const [isRunning, setIsRunning] = useState(false);

                useEffect(() => {
                    const sec = (initialMins || 15) * 60;
                    setTotalSeconds(sec);
                    setTimeLeft(sec);
                    setIsRunning(false);
                }, [initialMins]);

                useEffect(() => {
                    let int;
                    if (isRunning && timeLeft > 0) {
                        int = setInterval(() => setTimeLeft(t => t - 1), 1000);
                    } else if (timeLeft === 0) {
                        setIsRunning(false);
                    }
                    return () => clearInterval(int);
                }, [isRunning, timeLeft]);

                const minsLeft = Math.ceil(timeLeft / 60);
                // Procent av 60 minuter för Time Timer-skivan
                const fractionOf60 = Math.min(1, timeLeft / 3600);
                const degrees = fractionOf60 * 360;

                const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                const s = (timeLeft % 60).toString().padStart(2, '0');

                const changeMins = (delta) => {
                    const next = Math.max(1, Math.min(60, (initialMins || 15) + delta));
                    setInitialMins(next);
                };

                return (
                    <div className="flex flex-col items-center justify-between h-full py-1">
                        {/* Analog Time Timer urtavla */}
                        <div className="relative w-44 h-44 rounded-full border-4 border-slate-700 bg-white flex items-center justify-center shadow-inner my-1">
                            {/* Ticks 0..60 */}
                            {[0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55].map((val, i) => {
                                const angle = (i * 30);
                                return (
                                    <div key={val} className="absolute inset-0 flex justify-center text-[9px] font-bold text-slate-500 pt-0.5" style={{ transform: `rotate(${angle}deg)` }}>
                                        <span style={{ transform: `rotate(-${angle}deg)` }}>{val === 0 ? '60' : val}</span>
                                    </div>
                                );
                            })}
                            
                            {/* Röd Time Timer skiva */}
                            <div 
                                className="w-32 h-32 rounded-full transition-all duration-1000" 
                                style={{ 
                                    background: `conic-gradient(#ef4444 0deg, #ef4444 ${degrees}deg, #f1f5f9 ${degrees}deg, #f1f5f9 360deg)` 
                                }}
                            />
                            {/* Mittenpunkt */}
                            <div className="absolute w-3 h-3 rounded-full bg-slate-800 z-10 shadow"></div>
                        </div>

                        <div className="text-xl font-bold tabular-nums text-slate-800 tracking-wider">
                            {m}:{s}
                        </div>

                        <div className="flex gap-2 w-full mt-1">
                            <button onClick={() => changeMins(-5)} className="flex-1 bg-slate-100 hover:bg-slate-200 py-1 rounded-lg font-bold text-xs text-slate-600">- 5m</button>
                            <button onClick={() => changeMins(5)} className="flex-1 bg-slate-100 hover:bg-slate-200 py-1 rounded-lg font-bold text-xs text-slate-600">+ 5m</button>
                            <button onClick={() => setIsRunning(!isRunning)} className={`flex-2 px-4 py-1 rounded-lg font-bold text-xs text-white shadow ${isRunning ? 'bg-amber-600' : 'bg-[#6F8166]'}`}>
                                {isRunning ? 'Paus' : 'Start'}
                            </button>

                    const interval = setInterval(() => {
                        setVals(count === 1 ? [Math.floor(Math.random() * 6) + 1] : [Math.floor(Math.random() * 6) + 1, Math.floor(Math.random() * 6) + 1]);
                        times++;

                    }, 50);

                    <div className="flex flex-col items-center justify-between h-full py-1">

                const [counts, setCounts] = useState({'🤩':0, '🙂':0, '😐':0, '😔':0});

                useEffect(() => {
                    if (!active || !window.firebaseApp.db) return;
                    const qRef = window.firebaseApp.query(window.firebaseApp.collection(window.firebaseApp.db, "checkins"));
                    const unsubscribe = window.firebaseApp.onSnapshot(qRef, (snapshot) => {
                        let temp = {'🤩':0, '🙂':0, '😐':0, '😔':0};
                        snapshot.docs.forEach(doc => {
                            let d = doc.data();
                            if(d.boardId === boardId && temp[d.emoji] !== undefined) temp[d.emoji]++;

                        setCounts(temp);
                    });
                    return () => unsubscribe();
                }, [active]);

                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(baseUrl + '?student=checkin&boardId=' + boardId + '&q=' + question)}`;

                                                <div className="text-[10px] font-bold text-slate-600">{counts[emoji]}</div>
                                            </div>
                                        );

                                <div className="p-1.5 border border-dashed rounded-xl flex flex-col items-center bg-slate-50 mt-1">
                                    <img src={qrUrl} className="w-20 h-20" />
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            // 13. Exit Ticket
            const ExitTicketWidgetContent = ({ boardId, baseUrl, question, setQuestion, active, setActive, isSelected }) => {
                const [tickets, setTickets] = useState([]);

                useEffect(() => {
                    if (!active || !window.firebaseApp.db) return;
                    const qRef = window.firebaseApp.query(window.firebaseApp.collection(window.firebaseApp.db, "exittickets"));
                    const unsubscribe = window.firebaseApp.onSnapshot(qRef, (snapshot) => {
                        let temp = [];
                        snapshot.docs.forEach(doc => {
                            let d = doc.data();
                            if(d.boardId === boardId) temp.push(d);
                        });
                        setTickets(temp);
                    });
                    return () => unsubscribe();
                }, [active]);

                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(baseUrl + '?student=exitticket&boardId=' + boardId + '&q=' + question)}`;

                return (
                    <div className="h-full">
                        {!active ? (
                            <div className="flex flex-col h-full gap-3 justify-center">
                                <label className="font-bold text-xs text-slate-700">Fråga (fritext):</label>
                                <textarea value={question} onChange={e => setQuestion(e.target.value)} className="p-2 border rounded-xl text-xs h-20 resize-none"></textarea>
                                <button onClick={() => setActive(true)} className="bg-amber-500 hover:bg-amber-600 text-white py-2 rounded-xl font-bold text-xs shadow">Starta Exit Ticket</button>
                            </div>
                        ) : (
                            <div className="flex flex-col h-full">
                                <div className="flex justify-between items-center bg-slate-50 p-2 rounded-xl mb-2 border">
                                    <div className="font-bold text-xs text-slate-700 pr-2 truncate">{question}</div>
                                    <div className="flex items-center gap-2">
                                        {isSelected && <button onClick={() => setActive(false)} className="text-[10px] text-slate-500 underline">Ändra</button>}
                                        <img src={qrUrl} className="w-10 h-10 border bg-white p-0.5 rounded" />
                                    </div>
                                </div>
                                <div className="flex-1 overflow-y-auto grid grid-cols-2 gap-2 p-2 bg-slate-100 rounded-xl custom-scrollbar">
                                    {tickets.length === 0 && <div className="col-span-2 text-center text-slate-400 mt-6 text-xs">Väntar på svar...</div>}
                                    {tickets.map((t, i) => (
                                        <div key={i} className="post-it rounded-lg">
                                            <div className="font-bold text-[10px] border-b border-amber-300 pb-0.5 mb-1 text-slate-700">{t.name}</div>
                                            <div className="text-xs text-slate-900 leading-snug">{t.text}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        }
    </script>
</body>
</html>
