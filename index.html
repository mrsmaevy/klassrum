<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klassrumsskärm / Classroom Screen</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone för JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body { 
      user-select: none; 
      -webkit-user-select: none; 
      overflow: hidden; 
      margin: 0; 
      background-color: #0f172a;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.25); border-radius: 4px; }
    
    .glass {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 14px 30px -6px rgba(0,0,0,0.22);
    }
    
    input, textarea, select { 
      cursor: text; 
      user-select: text; 
      -webkit-user-select: text; 
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const i18n = {
      sv: {
        appTitle: "Klassrumsskärm",
        agenda: "Agenda",
        timer: "Tidtagare",
        traffic: "Trafikljus",
        work: "Arbetsform",
        noise: "Ljudnivå",
        dice: "Tärning",
        random: "Slumpa Namn",
        notes: "Anteckningar",
        changeBg: "Bakgrund",
        templates: "Mina Mallar",
        resetData: "Rensa",
        sure: "Säker?",
        add: "Lägg till",
        placeholder: "Ny lektionspunkt...",
        start: "Starta",
        pause: "Pausa",
        reset: "Nollställ",
        saveTemplate: "Spara mall",
        loadTemplate: "Ladda mall",
        templateName: "Namn på ny mall...",
        chooseRandom: "Slumpa!",
        rollDice: "Kasta tärning",
        silence: "Tystnad",
        whisper: "Viska",
        ask: "Fråga kompis",
        group: "Samarbete",
        micStart: "Starta Mätning",
        micStop: "Stoppa Mätning",
        tooLoud: "För högt! ⚠️",
        acceptable: "Acceptabel nivå",
        defaultNames: "Alma, Oliver, Maja, William, Elsa, Liam, Astrid, Elias, Selma, Hugo",
        emptyAgenda: "Inga punkter än. Lägg till en nedan!"
      },
      en: {
        appTitle: "Classroom Screen",
        agenda: "Agenda",
        timer: "Timer",
        traffic: "Traffic Light",
        work: "Work Mode",
        noise: "Noise Meter",
        dice: "Dice",
        random: "Random Name",
        notes: "Notes",
        changeBg: "Background",
        templates: "Templates",
        resetData: "Clear",
        sure: "Sure?",
        add: "Add",
        placeholder: "New item...",
        start: "Start",
        pause: "Pause",
        reset: "Reset",
        saveTemplate: "Save Profile",
        loadTemplate: "Load Profile",
        templateName: "Profile name...",
        chooseRandom: "Draw!",
        rollDice: "Roll Dice",
        silence: "Silence",
        whisper: "Whisper",
        ask: "Ask Neighbor",
        group: "Group Work",
        micStart: "Start Mic",
        micStop: "Stop Mic",
        tooLoud: "Too Loud! ⚠️",
        acceptable: "Acceptable",
        defaultNames: "Alice, Bob, Charlie, Diana, Ethan, Fiona, George, Hannah",
        emptyAgenda: "No items yet. Add one below!"
      }
    };

    const DEFAULT_BACKGROUNDS = [
      { name: 'Höstlöv / Autumn', url: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=80' },
      { name: 'Gyllene Höst / Golden Trees', url: 'https://images.unsplash.com/photo-1477414348463-c0eb7f1359b6?auto=format&fit=crop&w=2000&q=80' },
      { name: 'Skog / Forest', url: 'https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=2000&q=80' },
      { name: 'Sjö / Lake', url: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=2000&q=80' },
      { name: 'Mörk / Minimal Dark', url: 'linear-gradient(135deg, #1e293b 0%, #0f172a 100%)', isGradient: true }
    ];

    function App() {
      const loadLocal = (key, fallback) => {
        try {
          const val = localStorage.getItem(key);
          return val ? JSON.parse(val) : fallback;
        } catch(e) { return fallback; }
      };

      const [lang, setLang] = useState(loadLocal('cs_lang', 'sv'));
      const [bg, setBg] = useState(loadLocal('cs_bg', DEFAULT_BACKGROUNDS[0].url));
      
      const defaultWidgets = [
        { 
          id: 'agenda-init', 
          type: 'agenda', 
          x: 40, 
          y: 80, 
          w: 360, 
          z: 1, 
          data: { 
            items: [
              { id: 1, text: "Närvarokontroll", done: true },
              { id: 2, text: "Regler och förväntningar", done: false },
              { id: 3, text: "Tyst läsning: 10 minuter", done: false },
              { id: 4, text: "Tala engelska (parövning)", done: false }
            ] 
          } 
        },
        { 
          id: 'timer-init', 
          type: 'timer', 
          x: 430, 
          y: 80, 
          w: 340, 
          z: 2, 
          data: { initialTime: 600 } 
        }
      ];
      
      const [widgets, setWidgets] = useState(loadLocal('cs_widgets', defaultWidgets));
      const [showBgModal, setShowBgModal] = useState(false);
      const [showTemplatesModal, setShowTemplatesModal] = useState(false);
      const [topZ, setTopZ] = useState(20);
      const [resetConfirm, setResetConfirm] = useState(false);

      const t = i18n[lang];

      // Spara automatiskt till webbläsarens minne
      useEffect(() => {
        localStorage.setItem('cs_lang', JSON.stringify(lang));
        localStorage.setItem('cs_bg', JSON.stringify(bg));
        localStorage.setItem('cs_widgets', JSON.stringify(widgets));
      }, [lang, bg, widgets]);

      const [draggingId, setDraggingId] = useState(null);
      const dragOffset = useRef({ x: 0, y: 0 });

      const handlePointerDown = (id, e) => {
        if (['INPUT', 'BUTTON', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
        
        const clientX = e.clientX ?? e.touches?.[0]?.clientX;
        const clientY = e.clientY ?? e.touches?.[0]?.clientY;
        const widget = widgets.find(w => w.id === id);
        if (!widget || clientX === undefined) return;
        
        setTopZ(prev => prev + 1);
        setWidgets(prev => prev.map(w => w.id === id ? { ...w, z: topZ + 1 } : w));
        dragOffset.current = { x: clientX - widget.x, y: clientY - widget.y };
        setDraggingId(id);
      };

      useEffect(() => {
        const handleMove = (e) => {
          if (!draggingId) return;
          const clientX = e.clientX ?? e.touches?.[0]?.clientX;
          const clientY = e.clientY ?? e.touches?.[0]?.clientY;
          if (clientX === undefined) return;

          const newX = Math.max(0, clientX - dragOffset.current.x);
          const newY = Math.max(64, clientY - dragOffset.current.y);

          setWidgets(prev => prev.map(w => w.id === draggingId ? { ...w, x: newX, y: newY } : w));
        };
        const handleUp = () => setDraggingId(null);

        if (draggingId) {
          window.addEventListener('mousemove', handleMove);
          window.addEventListener('mouseup', handleUp);
          window.addEventListener('touchmove', handleMove, { passive: false });
          window.addEventListener('touchend', handleUp);
        }
        return () => {
          window.removeEventListener('mousemove', handleMove);
          window.removeEventListener('mouseup', handleUp);
          window.removeEventListener('touchmove', handleMove);
          window.removeEventListener('touchend', handleUp);
        };
      }, [draggingId]);

      const updateWidgetData = (id, dataOverrides) => {
        setWidgets(prev => prev.map(w => 
          w.id === id ? { ...w, data: { ...w.data, ...dataOverrides } } : w
        ));
      };

      const removeWidget = (id) => setWidgets(prev => prev.filter(w => w.id !== id));

      const addWidget = (type) => {
        setTopZ(prev => prev + 1);
        const newWidget = {
          id: `${type}-${Date.now()}`,
          type,
          x: 60 + ((widgets.length * 30) % 240),
          y: 90 + ((widgets.length * 30) % 180),
          w: type === 'traffic' ? 220 : (type === 'dice' ? 280 : 350),
          z: topZ + 1,
          data: {} 
        };

        if(type === 'agenda') newWidget.data = { items: [] };
        if(type === 'timer') newWidget.data = { initialTime: 600 };
        if(type === 'traffic') newWidget.data = { color: 'green' };
        if(type === 'work') newWidget.data = { mode: 'whisper' };
        if(type === 'random') newWidget.data = { names: t.defaultNames };
        if(type === 'dice') newWidget.data = { count: 2 };
        if(type === 'notes') newWidget.data = { text: "" };

        setWidgets(prev => [...prev, newWidget]);
      };

      const handleReset = () => {
        if (!resetConfirm) {
          setResetConfirm(true);
          setTimeout(() => setResetConfirm(false), 3000);
        } else {
          setWidgets([]);
          setResetConfirm(false);
        }
      };

      return (
        <div 
          className="relative w-screen h-screen overflow-hidden text-slate-800 transition-all duration-300 select-none"
          style={{ 
            background: bg.startsWith('linear') ? bg : `url(${bg}) center/cover no-repeat fixed` 
          }}
        >
          {/* Mjuk skugga över bakgrunden */}
          <div className="absolute inset-0 bg-black/20 pointer-events-none" />

          {/* Header */}
          <header className="absolute top-0 left-0 right-0 h-16 bg-black/40 backdrop-blur-md flex items-center justify-between px-6 z-40 text-white shadow-lg border-b border-white/10">
            <h1 className="font-bold text-lg sm:text-xl tracking-wide flex items-center gap-2">
              <span className="text-2xl">🏫</span> 
              <span>{t.appTitle}</span>
            </h1>

            <div className="flex gap-2 sm:gap-3 items-center">
              <TopClock />
              
              <button 
                onClick={() => setLang(lang === 'sv' ? 'en' : 'sv')} 
                className="px-3 py-1.5 bg-white/15 hover:bg-white/25 rounded-xl text-xs font-bold border border-white/20 transition active:scale-95"
              >
                {lang === 'sv' ? '🇸🇪 SV' : '🇬🇧 EN'}
              </button>

              <button 
                onClick={() => setShowBgModal(true)} 
                className="px-3 py-1.5 bg-white/15 hover:bg-white/25 rounded-xl text-xs font-bold border border-white/20 transition active:scale-95"
              >
                🎨 {t.changeBg}
              </button>

              <button 
                onClick={() => setShowTemplatesModal(true)} 
                className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-md transition active:scale-95"
              >
                📁 {t.templates}
              </button>

              <button 
                onClick={handleReset} 
                className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition active:scale-95 ${
                  resetConfirm ? 'bg-red-600 text-white border-red-400 animate-pulse' : 'bg-white/15 hover:bg-white/25 text-white border-white/20'
                }`}
              >
                {resetConfirm ? t.sure : `🗑️ ${t.resetData}`}
              </button>
            </div>
          </header>

          {/* Huvudskärm / Arbetsyta för widgets */}
          <main className="absolute inset-0 pt-16 pb-24 overflow-hidden">
            {widgets.map(widget => (
              <WidgetWrapper 
                key={widget.id} 
                widget={widget} 
                title={t[widget.type] || widget.type}
                onDown={(e) => handlePointerDown(widget.id, e)}
                onClose={() => removeWidget(widget.id)}
              >
                {widget.type === 'agenda' && <AgendaWidget data={widget.data} updateData={(d) => updateWidgetData(widget.id, d)} t={t} />}
                {widget.type === 'timer' && <TimerWidget data={widget.data} updateData={(d) => updateWidgetData(widget.id, d)} t={t} />}
                {widget.type === 'traffic' && <TrafficWidget data={widget.data} updateData={(d) => updateWidgetData(widget.id, d)} />}
                {widget.type === 'work' && <WorkModeWidget data={widget.data} updateData={(d) => updateWidgetData(widget.id, d)} t={t} />}
                {widget.type === 'random' && <RandomPickerWidget data={widget.data} updateData={(d) => updateWidgetData(widget.id, d)} t={t} />}
                {widget.type === 'dice' && <DiceWidget data={widget.data} updateData={(d) => updateWidgetData(widget.id, d)} t={t} />}
                {widget.type === 'noise' && <NoiseMeterWidget t={t} />}
                {widget.type === 'notes' && <NotesWidget data={widget.data} updateData={(d) => updateWidgetData(widget.id, d)} />}
              </WidgetWrapper>
            ))}
          </main>

          {/* Verktygsdocka längst ner */}
          <footer className="absolute bottom-3 left-1/2 -translate-x-1/2 z-40 max-w-[95vw] overflow-x-auto p-1 scrollbar-none">
            <div className="flex items-center gap-1.5 bg-slate-900/85 hover:bg-slate-900/95 backdrop-blur-xl border border-white/20 px-3 py-2 rounded-2xl shadow-2xl">
              <DockBtn icon="📋" label={t.agenda} onClick={() => addWidget('agenda')} />
              <DockBtn icon="⏱️" label={t.timer} onClick={() => addWidget('timer')} />
              <DockBtn icon="🎲" label={t.dice} onClick={() => addWidget('dice')} />
              <DockBtn icon="🔀" label={t.random} onClick={() => addWidget('random')} />
              <DockBtn icon="🚦" label={t.traffic} onClick={() => addWidget('traffic')} />
              <DockBtn icon="👥" label={t.work} onClick={() => addWidget('work')} />
              <DockBtn icon="🔊" label={t.noise} onClick={() => addWidget('noise')} />
              <DockBtn icon="📝" label={t.notes} onClick={() => addWidget('notes')} />
            </div>
          </footer>

          {/* Modal för Bakgrunder */}
          {showBgModal && (
            <BackgroundModal 
              currentBg={bg} 
              onSelect={(newBg) => { setBg(newBg); setShowBgModal(false); }} 
              onClose={() => setShowBgModal(false)} 
            />
          )}

          {/* Modal för Mallar (med Google Drive filstöd) */}
          {showTemplatesModal && (
            <TemplateModal 
              t={t} 
              widgets={widgets} 
              bg={bg} 
              onClose={() => setShowTemplatesModal(false)} 
              onLoad={(loadedWidgets, loadedBg) => { 
                setWidgets(loadedWidgets); 
                if (loadedBg) setBg(loadedBg); 
                setShowTemplatesModal(false); 
              }} 
            />
          )}
        </div>
      );
    }

    function TemplateModal({ t, widgets, bg, onClose, onLoad }) {
      const [templates, setTemplates] = useState([]);
      const [name, setName] = useState('');
      const [msg, setMsg] = useState('');

      useEffect(() => {
        try {
          const saved = localStorage.getItem('cs_templates');
          if (saved) setTemplates(JSON.parse(saved));
        } catch(e) {}
      }, []);

      const save = () => {
        if (!name.trim()) return;
        const newTemplates = [...templates, { id: Date.now(), name: name.trim(), widgets, bg }];
        localStorage.setItem('cs_templates', JSON.stringify(newTemplates));
        setTemplates(newTemplates);
        setName('');
        setMsg('✅ Mallen har sparats lokalt!');
        setTimeout(() => setMsg(''), 3000);
      };

      const remove = (id) => {
        const newTemplates = templates.filter(tpl => tpl.id !== id);
        localStorage.setItem('cs_templates', JSON.stringify(newTemplates));
        setTemplates(newTemplates);
      };

      // Exportera till en liten JSON-fil som läraren kan spara på Google Drive
      const exportToFile = () => {
        if (templates.length === 0) {
          setMsg('Skapa minst en mall först!');
          setTimeout(() => setMsg(''), 3000);
          return;
        }
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(templates, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `klassrumsmallar-${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        setMsg('✅ Filen laddades ner! Spara den på Google Drive.');
        setTimeout(() => setMsg(''), 3500);
      };

      // Läs in sparad mallfil från Google Drive / Hårddisk
      const importFromFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (Array.isArray(imported)) {
              const merged = [...templates, ...imported.map(tpl => ({ ...tpl, id: Date.now() + Math.random() }))];
              localStorage.setItem('cs_templates', JSON.stringify(merged));
              setTemplates(merged);
              setMsg('✅ Mallarna lästes in från filen!');
            } else {
              setMsg('❌ Fel filformat.');
            }
          } catch (err) {
            setMsg('❌ Kunde inte läsa filen.');
          }
          setTimeout(() => setMsg(''), 3500);
        };
        reader.readAsText(file);
      };

      return (
        <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl border border-slate-100 animate-in fade-in">
            <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
              <h2 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                <span>📁</span> {t.templates}
              </h2>
              <button onClick={onClose} className="text-slate-400 hover:text-black text-xl p-1">✕</button>
            </div>
            
            {/* Skapa ny mall */}
            <div className="flex gap-2 mb-3">
              <input 
                type="text" 
                value={name} 
                onChange={e => setName(e.target.value)} 
                placeholder={t.templateName} 
                className="flex-1 px-3 py-2 text-sm border border-slate-200 rounded-xl outline-none focus:border-indigo-500" 
              />
              <button 
                onClick={save} 
                className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold shadow transition"
              >
                {t.saveTemplate}
              </button>
            </div>
            
            {msg && <div className="text-xs font-bold text-emerald-600 mb-3 bg-emerald-50 p-2 rounded-lg border border-emerald-200">{msg}</div>}

            {/* Lista med sparade mallar */}
            <div className="space-y-2 max-h-52 overflow-y-auto mb-4 border-t border-slate-100 pt-3">
              {templates.length === 0 && (
                <p className="text-xs text-slate-400 italic text-center py-4">Inga sparade mallar ännu. Skriv ett namn ovan och spara din lektion!</p>
              )}
              {templates.map(tpl => (
                <div key={tpl.id} className="flex items-center justify-between p-3 bg-slate-50 border border-slate-200/70 rounded-xl hover:bg-slate-100/70 transition">
                  <div>
                    <span className="font-bold text-xs text-slate-800 block">{tpl.name}</span>
                    <span className="text-[10px] text-slate-400">{tpl.widgets?.length || 0} block</span>
                  </div>
                  <div className="flex gap-1.5">
                    <button 
                      onClick={() => onLoad(tpl.widgets, tpl.bg)} 
                      className="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-lg transition"
                    >
                      {t.loadTemplate}
                    </button>
                    <button 
                      onClick={() => remove(tpl.id)} 
                      className="px-2 py-1 bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold text-xs rounded-lg transition"
                      title="Radera mall"
                    >
                      🗑️
                    </button>
                  </div>
                </div>
              ))}
            </div>

            {/* Delning & Filhantering (Google Drive) */}
            <div className="border-t border-slate-200 pt-4">
              <span className="text-[11px] font-bold text-slate-500 uppercase tracking-wider block mb-2">
                Dela eller spara på Google Drive:
              </span>
              <div className="flex gap-2">
                <button 
                  onClick={exportToFile} 
                  className="flex-1 px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition flex items-center justify-center gap-1.5"
                >
                  <span>📥</span> Ladda ner fil
                </button>
                <label className="flex-1 px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl text-center cursor-pointer transition flex items-center justify-center gap-1.5">
                  <span>📤</span> Öppna från fil
                  <input type="file" accept=".json" onChange={importFromFile} className="hidden" />
                </label>
              </div>
              <p className="text-[10px] text-slate-400 text-center mt-2">
                Spara filen i Google Drive för att ta med dina lektioner till valfritt klassrum!
              </p>
            </div>
          </div>
        </div>
      );
    }

    function BackgroundModal({ currentBg, onSelect, onClose }) {
      const [customUrl, setCustomUrl] = useState('');
      return (
        <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl p-6 w-full max-w-lg shadow-2xl">
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-lg font-bold text-slate-800">Välj bakgrund för klassrummet</h2>
              <button onClick={onClose} className="text-slate-400 hover:text-black text-xl p-1">✕</button>
            </div>

            <div className="grid grid-cols-2 gap-3 mb-4 max-h-60 overflow-y-auto">
              {DEFAULT_BACKGROUNDS.map((b, i) => (
                <button 
                  key={i} 
                  onClick={() => onSelect(b.url)} 
                  className={`h-24 rounded-xl overflow-hidden relative border-2 text-left p-2 flex items-end transition ${
                    currentBg === b.url ? 'border-indigo-600 ring-2 ring-indigo-500/30' : 'border-transparent hover:border-slate-300'
                  }`}
                  style={{ background: b.isGradient ? b.url : `url(${b.url}) center/cover` }}
                >
                  <span className="text-white text-xs font-bold drop-shadow bg-black/40 px-2 py-0.5 rounded">{b.name}</span>
                </button>
              ))}
            </div>

            <div className="border-t border-slate-100 pt-3">
              <label className="text-xs font-semibold text-slate-600 block mb-1">Eller klistra in en egen bildlänk:</label>
              <div className="flex gap-2">
                <input 
                  type="text" 
                  value={customUrl} 
                  onChange={e => setCustomUrl(e.target.value)} 
                  placeholder="https://example.com/bild.jpg" 
                  className="flex-1 px-3 py-2 text-xs border rounded-xl"
                />
                <button 
                  onClick={() => { if(customUrl.trim()) onSelect(customUrl.trim()); }} 
                  className="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold"
                >
                  Välj
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function WidgetWrapper({ widget, title, onDown, onClose, children }) {
      return (
        <div 
          className="absolute glass rounded-2xl shadow-2xl flex flex-col overflow-hidden" 
          style={{ 
            transform: `translate3d(${widget.x}px, ${widget.y}px, 0)`, 
            width: widget.w, 
            zIndex: widget.z 
          }}
        >
          <div 
            onMouseDown={onDown} 
            onTouchStart={onDown} 
            className="flex justify-between items-center px-4 py-2.5 bg-slate-100/90 border-b border-slate-200 cursor-grab active:cursor-grabbing rounded-t-2xl"
          >
            <span className="font-bold text-xs uppercase tracking-wider text-slate-700 pointer-events-none">{title}</span>
            <button 
              onClick={onClose} 
              className="text-slate-400 hover:text-red-600 hover:bg-red-50 w-6 h-6 flex items-center justify-center rounded transition text-sm"
            >
              ✕
            </button>
          </div>
          <div className="p-4 flex-1 overflow-auto">{children}</div>
        </div>
      );
    }

    function DockBtn({ icon, label, onClick }) {
      return (
        <button 
          onClick={onClick} 
          className="flex flex-col items-center justify-center w-14 h-14 rounded-xl hover:bg-white/10 text-white transition active:scale-95 group"
        >
          <span className="text-xl mb-0.5 group-hover:scale-110 transition-transform">{icon}</span>
          <span className="text-[9px] uppercase font-bold tracking-wider opacity-80 group-hover:opacity-100 truncate w-full text-center">{label}</span>
        </button>
      );
    }

    function TopClock() {
      const [time, setTime] = useState(new Date());
      useEffect(() => { 
        const timer = setInterval(() => setTime(new Date()), 1000); 
        return () => clearInterval(timer); 
      }, []);
      return (
        <div className="text-xs font-semibold bg-white/15 px-3 py-1.5 rounded-xl border border-white/20">
          {time.toLocaleTimeString([], { hour: '2-digit', minute:'2-digit' })}
        </div>
      );
    }

    function AgendaWidget({ data, updateData, t }) {
      const items = data.items || [];
      const [input, setInput] = useState("");

      const toggle = (id) => {
        updateData({ items: items.map(it => it.id === id ? { ...it, done: !it.done } : it) });
      };

      const remove = (id) => {
        updateData({ items: items.filter(it => it.id !== id) });
      };

      const add = (e) => {
        e.preventDefault();
        if (input.trim()) {
          updateData({ items: [...items, { id: Date.now(), text: input.trim(), done: false }] });
          setInput('');
        }
      };

      return (
        <div className="space-y-3">
          <ul className="space-y-1.5 max-h-56 overflow-y-auto pr-1">
            {items.length === 0 && (
              <p className="text-xs text-slate-400 italic text-center py-4">{t.emptyAgenda}</p>
            )}
            {items.map(it => (
              <li 
                key={it.id} 
                className={`flex items-center justify-between p-2 rounded-xl border transition ${
                  it.done ? 'bg-slate-100/60 opacity-60 line-through border-transparent' : 'bg-white shadow-sm border-slate-200'
                }`}
              >
                <div 
                  className="flex items-center gap-2.5 overflow-hidden cursor-pointer flex-1" 
                  onClick={() => toggle(it.id)}
                >
                  <div className={`w-5 h-5 rounded-md flex items-center justify-center text-xs text-white transition-colors ${it.done ? 'bg-emerald-500' : 'bg-slate-200'}`}>
                    {it.done ? '✓' : ''}
                  </div>
                  <span className="text-xs font-medium truncate text-slate-800">{it.text}</span>
                </div>
                <button 
                  onClick={() => remove(it.id)} 
                  className="w-7 h-7 flex items-center justify-center text-slate-300 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition" 
                  title="Radera punkt"
                >
                  🗑️
                </button>
              </li>
            ))}
          </ul>
          <form onSubmit={add} className="flex gap-2 pt-1 border-t border-slate-100">
            <input 
              type="text" 
              value={input} 
              onChange={e => setInput(e.target.value)} 
              placeholder={t.placeholder} 
              className="flex-1 text-xs px-3 py-2 border rounded-xl outline-none focus:border-indigo-500" 
            />
            <button type="submit" className="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-xl font-bold text-sm transition">
              +
            </button>
          </form>
        </div>
      );
    }

    function TimerWidget({ data, updateData, t }) {
      const initialTime = data.initialTime || 600;
      const [time, setTime] = useState(initialTime);
      const [running, setRunning] = useState(false);

      useEffect(() => {
        let timer;
        if (running && time > 0) timer = setInterval(() => setTime(prev => prev - 1), 1000);
        else if (running && time === 0) setRunning(false);
        return () => clearInterval(timer);
      }, [running, time]);

      const format = (sec) => `${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`;

      const handleSetTime = (mins) => {
        const secs = mins * 60;
        updateData({ initialTime: secs });
        setTime(secs);
        setRunning(false);
      };

      return (
        <div className="text-center">
          <div className="bg-gradient-to-br from-red-600 to-rose-700 text-white rounded-2xl p-4 shadow-inner mb-3">
            <div className="text-5xl font-mono font-bold tracking-tight">{format(time)}</div>
          </div>
          <div className="flex gap-2 justify-center mb-3">
            <button 
              onClick={() => setRunning(!running)} 
              className="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 rounded-xl text-xs font-bold shadow transition"
            >
              {running ? t.pause : t.start}
            </button>
            <button 
              onClick={() => { setTime(initialTime); setRunning(false); }} 
              className="px-4 bg-slate-200 hover:bg-slate-300 py-2 rounded-xl text-xs font-bold transition"
            >
              {t.reset}
            </button>
          </div>
          <div className="flex gap-1.5">
            {[1, 5, 10, 15].map(m => (
              <button 
                key={m} 
                onClick={() => handleSetTime(m)} 
                className="flex-1 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-200 py-1.5 rounded-lg font-bold"
              >
                {m}m
              </button>
            ))}
          </div>
        </div>
      );
    }

    function TrafficWidget({ data, updateData }) {
      const active = data.color || 'green';
      const changeColor = (c) => updateData({ color: c });
      return (
        <div className="flex flex-col items-center">
          <div className="bg-slate-900 p-4 rounded-3xl flex flex-col gap-3 shadow-xl">
            <button onClick={() => changeColor('red')} className={`w-14 h-14 rounded-full transition-all ${active === 'red' ? 'bg-red-500 shadow-[0_0_20px_red] scale-105' : 'bg-red-950/60'}`} />
            <button onClick={() => changeColor('yellow')} className={`w-14 h-14 rounded-full transition-all ${active === 'yellow' ? 'bg-yellow-400 shadow-[0_0_20px_yellow] scale-105' : 'bg-yellow-950/60'}`} />
            <button onClick={() => changeColor('green')} className={`w-14 h-14 rounded-full transition-all ${active === 'green' ? 'bg-emerald-500 shadow-[0_0_20px_lime] scale-105' : 'bg-green-950/60'}`} />
          </div>
        </div>
      );
    }

    function WorkModeWidget({ data, updateData, t }) {
      const mode = data.mode || 'whisper';
      const modes = [
        { id: 'silence', icon: '🤫', label: t.silence },
        { id: 'whisper', icon: '🗣️', label: t.whisper },
        { id: 'ask', icon: '👥', label: t.ask },
        { id: 'group', icon: '🤝', label: t.group }
      ];
      return (
        <div className="grid grid-cols-2 gap-2">
          {modes.map(m => (
            <button 
              key={m.id} 
              onClick={() => updateData({ mode: m.id })} 
              className={`p-3 rounded-xl flex flex-col items-center border transition-all ${
                mode === m.id ? 'bg-indigo-50 border-indigo-500 shadow-sm scale-105 text-indigo-900' : 'bg-white border-slate-200 hover:border-slate-300 text-slate-600'
              }`}
            >
              <span className="text-2xl mb-1">{m.icon}</span>
              <span className="text-[11px] font-bold">{m.label}</span>
            </button>
          ))}
        </div>
      );
    }

    function RandomPickerWidget({ data, updateData, t }) {
      const namesStr = data.names || t.defaultNames;
      const [selected, setSelected] = useState("?");
      const [rolling, setRolling] = useState(false);
      const [isEditing, setIsEditing] = useState(false);

      const pickRandom = () => {
        const arr = namesStr.split(/[,\n]/).map(n => n.trim()).filter(Boolean);
        if (arr.length === 0 || rolling) return;
        
        setRolling(true);
        let ticks = 0;
        const interval = setInterval(() => {
          setSelected(arr[Math.floor(Math.random() * arr.length)]);
          ticks++;
          if (ticks > 15) { 
            clearInterval(interval); 
            setRolling(false); 
          }
        }, 80);
      };

      return (
        <div className="flex flex-col items-center text-center">
          {isEditing ? (
            <div className="w-full space-y-2">
              <textarea 
                value={namesStr} 
                onChange={(e) => updateData({ names: e.target.value })} 
                rows="4" 
                className="w-full text-xs p-2 border rounded-xl outline-none" 
                placeholder="Skriv namn separerade med kommatecken..." 
              />
              <button onClick={() => setIsEditing(false)} className="w-full bg-indigo-600 text-white py-1.5 rounded-xl text-xs font-bold">
                Klar
              </button>
            </div>
          ) : (
            <div className="w-full relative">
              <button 
                onClick={() => setIsEditing(true)} 
                className="absolute top-2 right-2 text-xs text-white/80 hover:text-white bg-black/20 px-2 py-1 rounded-lg"
              >
                ⚙️ Redigera
              </button>
              <div className="w-full py-6 bg-gradient-to-br from-red-600 to-rose-700 rounded-2xl text-white shadow-inner mb-3">
                <div className={`text-3xl font-bold ${rolling ? 'scale-110' : ''}`}>{selected}</div>
              </div>
              <button 
                onClick={pickRandom} 
                disabled={rolling} 
                className="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2.5 rounded-xl font-bold text-xs w-full transition active:scale-95"
              >
                {t.chooseRandom}
              </button>
            </div>
          )}
        </div>
      );
    }

    function DiceWidget({ data, updateData, t }) {
      const count = data.count || 2;
      const [dice, setDice] = useState(Array.from({ length: count }, () => 1));
      const [rolling, setRolling] = useState(false);

      const roll = () => {
        if (rolling) return;
        setRolling(true);
        let ticks = 0;
        const interval = setInterval(() => {
          setDice(Array.from({ length: count }, () => Math.floor(Math.random() * 6) + 1));
          ticks++;
          if (ticks > 10) { clearInterval(interval); setRolling(false); }
        }, 50);
      };

      return (
        <div className="text-center space-y-3">
          <div className="flex justify-center gap-3 py-2 items-center h-20">
            {dice.map((val, i) => (
              <div key={i} className={`w-12 h-12 bg-white border-2 border-slate-200 rounded-xl shadow-md flex items-center justify-center text-2xl font-black transition-transform ${rolling ? 'rotate-12 scale-110' : ''}`}>
                {val}
              </div>
            ))}
          </div>
          <div className="flex justify-center gap-2">
            {[1, 2, 3].map(n => (
              <button 
                key={n} 
                onClick={() => { updateData({ count: n }); setDice(Array.from({ length: n }, () => 1)); }} 
                className={`px-3 py-1 rounded-lg text-xs font-bold border transition ${count === n ? 'bg-slate-800 text-white' : 'bg-white'}`}
              >
                {n}
              </button>
            ))}
          </div>
          <button onClick={roll} disabled={rolling} className="w-full bg-pink-600 hover:bg-pink-700 text-white py-2 rounded-xl text-xs font-bold shadow transition active:scale-95">
            {t.rollDice}
          </button>
        </div>
      );
    }

    function NoiseMeterWidget({ t }) {
      const [level, setLevel] = useState(15);
      const [active, setActive] = useState(false);
      const intervalRef = useRef(null);

      const toggleMic = () => {
        if (active) {
          clearInterval(intervalRef.current);
          setActive(false);
          setLevel(15);
        } else {
          setActive(true);
          intervalRef.current = setInterval(() => {
            setLevel(prev => Math.max(5, Math.min(95, prev + (Math.random() - 0.5) * 35)));
          }, 200);
        }
      };

      useEffect(() => { return () => clearInterval(intervalRef.current); }, []);

      return (
        <div className="space-y-3">
          <div className="bg-slate-50 border p-3 rounded-xl relative overflow-hidden">
            <div className="flex justify-between text-xs font-bold mb-2">
              <span className="text-slate-500">{active ? 'PÅ' : 'AV'}</span>
              <span className={level > 80 ? "text-red-600" : "text-emerald-600"}>
                {level > 80 ? t.tooLoud : t.acceptable}
              </span>
            </div>
            <div className="h-5 bg-slate-200 rounded-full w-full overflow-hidden relative">
              <div 
                className={`h-full transition-all duration-200 ${level > 80 ? 'bg-red-500' : level > 60 ? 'bg-yellow-400' : 'bg-emerald-500'}`} 
                style={{ width: `${level}%` }} 
              />
              <div className="absolute top-0 bottom-0 w-1 bg-red-600 z-20" style={{ left: `80%` }} />
            </div>
          </div>
          <button 
            onClick={toggleMic} 
            className={`w-full py-2 rounded-xl text-xs font-bold text-white shadow transition ${active ? 'bg-red-500 hover:bg-red-600' : 'bg-emerald-600 hover:bg-emerald-700'}`}
          >
            {active ? t.micStop : t.micStart}
          </button>
        </div>
      );
    }

    function NotesWidget({ data, updateData }) {
      return (
        <div className="h-full flex flex-col">
          <textarea 
            value={data.text || ""} 
            onChange={e => updateData({ text: e.target.value })} 
            placeholder="Skriv dina instruktioner till klassen här..." 
            className="w-full h-36 p-3 bg-amber-50/70 border border-amber-200 rounded-xl outline-none resize-none text-xs text-slate-800"
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
